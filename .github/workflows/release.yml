# PCG 集團版：發布「單一安裝檔」（手動執行）
# 離線資源包整個包進 Setup.exe：同仁只要一個檔案，點兩下就裝好（不用解壓縮、不用管資料夾）。
# 發布前先在乾淨的 Windows 上實際安裝、自我檢查一次；通過才放到 GitHub Releases（不會過期）。
name: 發布安裝包

on:
  workflow_dispatch:
    inputs:
      models:
        description: "語音辨識模型（逗號分隔；small 必要。加 medium 錄音檔較準，但安裝檔會超過 GitHub 2 GB 上限）"
        default: "small"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安裝 Inno Setup 與安裝畫面的語言檔
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          New-Item -ItemType Directory -Force group/windows/lang | Out-Null
          foreach ($n in 'ChineseTraditional','Indonesian','Vietnamese','Hindi') {
            try { Invoke-WebRequest "https://raw.githubusercontent.com/jrsoftware/issrc/main/Files/Languages/Unofficial/$n.isl" -OutFile "group/windows/lang/$n.isl" } catch { Write-Host "略過 $n" }
          }

      - name: 製作離線資源包（翻譯模型轉成 int8，約 0.5 GB）
        run: python group/windows/build_bundle.py --out dist/PCG-offline --models "${{ inputs.models }}" --m2m-convert

      - name: 編譯單一安裝檔
        shell: pwsh
        run: |
          $v = (Get-Date -Format 'yyyy.M.d') + '.r' + $env:GITHUB_RUN_NUMBER
          "VER=$v" | Out-File -Append $env:GITHUB_ENV
          # 畫面上顯示的版本（簡易頁面、即時字幕、IT 設定頁）：同仁回報問題時對照用
          $info = @{ version = $v; commit = $env:GITHUB_SHA.Substring(0, 7) } | ConvertTo-Json -Compress
          [System.IO.File]::WriteAllText("group/version.json", $info, (New-Object System.Text.UTF8Encoding($false)))
          $bundle = (Resolve-Path dist/PCG-offline).Path
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$v" "/DEmbedBundle=$bundle" group\windows\PCG-Setup.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $exe = Get-ChildItem dist -Filter "PCG-Meeting-Translator-Setup-*.exe" | Select-Object -First 1
          $mb = [math]::Round($exe.Length / 1MB)
          Write-Host "$($exe.Name)：$mb MB"
          if ($exe.Length -ge 2GB) { throw "安裝檔 $mb MB 超過 GitHub Releases 的 2 GB 上限" }

      - name: 實際安裝一次（只用這一個檔案，旁邊沒有資源包）
        shell: pwsh
        run: |
          $exe = Get-ChildItem dist -Filter "PCG-Meeting-Translator-Setup-*.exe" | Select-Object -First 1
          $t = New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\only-setup"
          Copy-Item $exe.FullName $t
          $log = "C:\PCGtest\group_data\install.log"
          Start-Process (Join-Path $t $exe.Name) -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/DIR=C:\PCGtest' -Wait
          for ($i = 0; $i -lt 300; $i++) {
            if ((Test-Path $log) -and (Select-String -Path $log -Pattern '安裝完成|\[錯誤\]' -Encoding utf8 -Quiet)) { break }
            Start-Sleep -Seconds 5
          }
          Get-Content $log -Encoding utf8 | Select-Object -Last 15
          if (-not (Select-String -Path $log -Pattern '安裝完成' -Encoding utf8 -Quiet)) { exit 1 }
          $ver = Get-Content C:\PCGtest\group\version.json -Raw | ConvertFrom-Json
          if ($ver.version -ne $env:VER) { throw "裝好的版本是 $($ver.version)，應該是 $env:VER" }
          $env:HF_HUB_CACHE = "C:\PCGtest\hf_cache"; $env:HF_HUB_OFFLINE = "1"
          $env:PATH = "C:\PCGtest\tools\ffmpeg\bin;" + $env:PATH
          & C:\PCGtest\python\python.exe C:\PCGtest\group\windows\selftest.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: 發布到 GitHub Releases
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $exe = Get-ChildItem dist -Filter "PCG-Meeting-Translator-Setup-*.exe" | Select-Object -First 1
          $mb = [math]::Round($exe.Length / 1MB)
          $notes = @"
          ## PCG 會議翻譯 $env:VER

          **只要下載這一個檔案**：``$($exe.Name)``（約 $mb MB）

          放到 Google Drive 或公司共用資料夾，同仁下載後點兩下安裝。
          - 不需要網路、不需要系統管理員；預設裝到 D:\PCG-live-whisper（沒有 D 槽就裝 C 槽）
          - 第一次執行會出現「Windows 已保護您的電腦」：按「其他資訊」→「仍要執行」（沒有程式碼簽章）
          - 裝好後桌面會有「PCG 會議翻譯」

          已在乾淨的 Windows 上實際安裝並通過自我檢查（套件、模型、5 個翻譯方向）。
          語音辨識模型：${{ inputs.models }}；commit $($env:GITHUB_SHA.Substring(0,7))
          "@
          $notes | Out-File -Encoding utf8 notes.md
          gh release create "v$env:VER" $exe.FullName --title "PCG 會議翻譯 $env:VER" --notes-file notes.md --target $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
