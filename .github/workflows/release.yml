# PCG 集團版：發布「單一安裝檔」（手動執行）
# 離線資源包整個包進 Setup.exe：同仁只要一個檔案，點兩下就裝好（不用解壓縮、不用管資料夾）。
# 發布前先在乾淨的 Windows 上實際安裝、自我檢查一次；通過才放到 GitHub Releases（不會過期）。
name: 發布安裝包

on:
  workflow_dispatch:
    inputs:
      models:
        description: "語音辨識模型（逗號分隔；small 必要。加 medium 錄音檔較準，但安裝檔會超過 GitHub 2 GB 上限）"
        default: "small"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      IN_MODELS: ${{ inputs.models }}   # 手動輸入的參數一律經環境變數傳進指令（不直接拼進 run，避免指令注入）
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # 要比對上一版的套件清單，決定能不能用小更新包
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安裝 Inno Setup 與安裝畫面的語言檔
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          New-Item -ItemType Directory -Force group/windows/lang | Out-Null
          foreach ($n in 'ChineseTraditional','Indonesian','Vietnamese','Hindi') {
            try { Invoke-WebRequest "https://raw.githubusercontent.com/jrsoftware/issrc/main/Files/Languages/Unofficial/$n.isl" -OutFile "group/windows/lang/$n.isl" } catch { Write-Host "略過 $n" }
          }

      - name: 製作離線資源包（翻譯模型轉成 int8，約 0.5 GB）
        # 包一層 bundle_ci.py：下載重試、ffmpeg「latest」壞掉時改用 BtbN 最近的自動建置（不改 build_bundle.py，小更新包才不受影響）
        env:
          GH_TOKEN: ${{ github.token }}
        run: python group/windows/bundle_ci.py --out dist/PCG-offline --models "$env:IN_MODELS" --m2m-convert

      - name: 編譯單一安裝檔
        shell: pwsh
        run: |
          $v = (Get-Date -Format 'yyyy.M.d') + '.r' + $env:GITHUB_RUN_NUMBER
          "VER=$v" | Out-File -Append $env:GITHUB_ENV
          # 畫面上顯示的版本（簡易頁面、即時字幕、IT 設定頁）：同仁回報問題時對照用
          $info = @{ version = $v; commit = $env:GITHUB_SHA.Substring(0, 7) } | ConvertTo-Json -Compress
          [System.IO.File]::WriteAllText("group/version.json", $info, (New-Object System.Text.UTF8Encoding($false)))
          $bundle = (Resolve-Path dist/PCG-offline).Path
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$v" "/DEmbedBundle=$bundle" group\windows\PCG-Setup.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $exe = Get-ChildItem dist -Filter "PCG-Meeting-Translator-Setup-*.exe" | Select-Object -First 1
          $mb = [math]::Round($exe.Length / 1MB)
          Write-Host "$($exe.Name)：$mb MB"
          if ($exe.Length -ge 2GB) { throw "安裝檔 $mb MB 超過 GitHub Releases 的 2 GB 上限" }

      - name: 實際安裝一次（只用這一個檔案，旁邊沒有資源包）
        shell: pwsh
        run: |
          $exe = Get-ChildItem dist -Filter "PCG-Meeting-Translator-Setup-*.exe" | Select-Object -First 1
          $t = New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\only-setup"
          Copy-Item $exe.FullName $t
          $log = "C:\PCGtest\group_data\install.log"
          Start-Process (Join-Path $t $exe.Name) -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/DIR=C:\PCGtest' -Wait
          for ($i = 0; $i -lt 300; $i++) {
            if ((Test-Path $log) -and (Select-String -Path $log -Pattern '安裝完成|\[錯誤\]' -Encoding utf8 -Quiet)) { break }
            Start-Sleep -Seconds 5
          }
          Get-Content $log -Encoding utf8 | Select-Object -Last 15
          if (-not (Select-String -Path $log -Pattern '安裝完成' -Encoding utf8 -Quiet)) { exit 1 }
          $ver = Get-Content C:\PCGtest\group\version.json -Raw | ConvertFrom-Json
          if ($ver.version -ne $env:VER) { throw "裝好的版本是 $($ver.version)，應該是 $env:VER" }
          $env:HF_HUB_CACHE = "C:\PCGtest\hf_cache"; $env:HF_HUB_OFFLINE = "1"
          $env:PATH = "C:\PCGtest\tools\ffmpeg\bin;" + $env:PATH
          & C:\PCGtest\python\python.exe C:\PCGtest\group\windows\selftest.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: 製作小更新包，套用在剛裝好的電腦上測試
        shell: pwsh
        run: |
          # 小更新包只換程式；裝之前比對已安裝的套件清單與資源包腳本，跟這一版不同就拒絕（要用完整安裝檔）
          $req = (Get-FileHash group\windows\requirements-cpu.txt -Algorithm SHA256).Hash
          $bb = (Get-FileHash group\windows\build_bundle.py -Algorithm SHA256).Hash
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$env:VER" "/DPatchOnly" "/DReqSha=$req" "/DBundleSha=$bb" group\windows\PCG-Setup.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $patch = Get-ChildItem dist -Filter "PCG-Update-*.exe" | Select-Object -First 1
          Write-Host "$($patch.Name)：$([math]::Round($patch.Length / 1MB, 1)) MB"

          # 1. 假裝裝的是舊版，套用小更新包 → 版本要變成這一版、自我檢查要過
          [System.IO.File]::WriteAllText("C:\PCGtest\group\version.json", '{"version":"old"}')
          $p = Start-Process $patch.FullName -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait -PassThru
          if (Test-Path C:\PCGtest\group_data\update.log) { Get-Content C:\PCGtest\group_data\update.log -Encoding utf8 | Select-Object -Last 12 }
          if ($p.ExitCode -ne 0) { throw "小更新包結束代碼 $($p.ExitCode)" }
          if (-not (Select-String -Path C:\PCGtest\group_data\update.log -Pattern '更新完成' -Encoding utf8 -Quiet)) { throw "小更新包的自我檢查沒有通過" }
          $ver = Get-Content C:\PCGtest\group\version.json -Raw | ConvertFrom-Json
          if ($ver.version -ne $env:VER) { throw "更新後版本是 $($ver.version)，應該是 $env:VER" }

          # 2. 套件清單不同（模擬「這次有新套件」）→ 要拒絕、不能動到已安裝的程式
          Add-Content C:\PCGtest\group\windows\requirements-cpu.txt "newpkg==1.0"
          [System.IO.File]::WriteAllText("C:\PCGtest\group\version.json", '{"version":"old"}')
          $p = Start-Process $patch.FullName -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait -PassThru
          if ($p.ExitCode -eq 0) { throw "套件不同時小更新包應該拒絕安裝" }
          $ver = Get-Content C:\PCGtest\group\version.json -Raw | ConvertFrom-Json
          if ($ver.version -ne "old") { throw "被拒絕的小更新包不應該改動程式" }
          Write-Host "小更新包：正常更新、套件不同時拒絕，兩項都通過"

          # 3. 跟上一版比：套件清單與資源包腳本都沒變，已裝上一版的電腦才能用小更新包
          $prev = git describe --tags --abbrev=0 --match "v*" 2>$null
          $ok = $false
          if ($prev) {
            git diff --quiet $prev HEAD -- group/windows/requirements-cpu.txt group/windows/build_bundle.py
            $ok = ($LASTEXITCODE -eq 0)
          }
          $global:LASTEXITCODE = 0
          Write-Host "上一版：$prev；可以用小更新包：$ok"
          "PREV=$prev" | Out-File -Append $env:GITHUB_ENV
          "PATCH_OK=$ok" | Out-File -Append $env:GITHUB_ENV

      - name: 一鍵更新實測（從共用資料夾：下載、比對指紋、關掉程式、安裝、重新開啟）
        shell: pwsh
        run: |
          # 還原上一步故意改壞的套件清單，假裝裝的是舊版
          Copy-Item group\windows\requirements-cpu.txt C:\PCGtest\group\windows\requirements-cpu.txt -Force
          [System.IO.File]::WriteAllText("C:\PCGtest\group\version.json", '{"version":"2026.1.1.r1"}')
          $patch = Get-ChildItem dist -Filter "PCG-Update-*.exe" | Select-Object -First 1
          $share = New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\share"
          Copy-Item $patch.FullName $share
          (Get-FileHash $patch.FullName -Algorithm SHA256).Hash.ToLower() + "  " + $patch.Name | Out-File -Encoding ascii "$share\$($patch.Name).sha256"
          $cfg = Get-Content C:\PCGtest\config.json -Raw | ConvertFrom-Json
          $cfg.pcg_simple | Add-Member -NotePropertyName update_share -NotePropertyValue $share.FullName -Force
          $cfg.pcg_simple | Add-Member -NotePropertyName update_check -NotePropertyValue $true -Force
          [System.IO.File]::WriteAllText("C:\PCGtest\config.json", ($cfg | ConvertTo-Json -Depth 8), (New-Object System.Text.UTF8Encoding($false)))
          powershell -NoProfile -ExecutionPolicy Bypass -File C:\PCGtest\group\windows\launch.ps1 -NoBrowser
          $u = "http://127.0.0.1:19781/api/simple/update"
          $info = Invoke-RestMethod "$u`?force=1" -TimeoutSec 60
          Write-Host ("目前 {0}，最新 {1}（{2}，{3}）" -f $info.current, $info.latest.version, $info.latest.kind, $info.latest.source)
          if (-not $info.available -or $info.latest.version -ne $env:VER) { throw "沒有找到共用資料夾裡的新版" }
          $r = Invoke-RestMethod $u -Method Post -ContentType 'application/json' -Body '{}' -TimeoutSec 120
          if (-not $r.ok) { throw "按下更新失敗：$($r | ConvertTo-Json)" }
          $done = $false
          for ($i = 0; $i -lt 80; $i++) {
            Start-Sleep -Seconds 3
            try { $c = Invoke-RestMethod $u -TimeoutSec 5; if ($c.current -eq $env:VER) { $done = $true; break } } catch { }
          }
          Get-Content C:\PCGtest\group_data\update.log -Encoding utf8 -ErrorAction SilentlyContinue | Select-Object -Last 6
          if (-not $done) { throw "一鍵更新後程式沒有以新版重新開啟" }
          Write-Host "一鍵更新：下載、比對指紋、安裝、自我檢查、重新開啟，全部完成（$env:VER）"

      - name: 發布到 GitHub Releases
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $exe = Get-ChildItem dist -Filter "PCG-Meeting-Translator-Setup-*.exe" | Select-Object -First 1
          $patch = Get-ChildItem dist -Filter "PCG-Update-*.exe" | Select-Object -First 1
          $mb = [math]::Round($exe.Length / 1MB)
          $files = @($exe.FullName)
          if ($env:PATCH_OK -eq "True") {
            # 小更新包的指紋檔：IT 放到公司共用資料夾時一起放，同仁電腦安裝前會比對
            $sha = "$($patch.FullName).sha256"
            (Get-FileHash $patch.FullName -Algorithm SHA256).Hash.ToLower() + "  " + $patch.Name | Out-File -Encoding ascii $sha
            $files += $patch.FullName
            $files += $sha
            $line = "``$($patch.Name)``（約 $([math]::Round($patch.Length / 1MB)) MB；已裝 $env:PREV 的電腦可以用）；如果出現「這次更新包含新的套件或模型」，改用完整安裝檔"
            $tested = "、套用小更新包"
            $lineEn = "``$($patch.Name)`` (about $([math]::Round($patch.Length / 1MB)) MB; works on computers with $env:PREV). If it says new components are needed, use the full installer"
          } else {
            $line = "這一版有新的套件或模型，請用完整安裝檔（直接裝在舊版上面，設定與錄音會保留）"
            $tested = ""
            $lineEn = "This version has new packages or models: use the full installer (install over the old version; settings and recordings are kept)"
          }
          $notes = Get-Content group/windows/release-notes.md -Raw -Encoding utf8
          $vals = [ordered]@{
            '{PATCH_LINE_EN}' = $lineEn; '{PATCH_LINE}' = $line; '{PATCH_TESTED}' = $tested; '{VER}' = $env:VER; '{FULL_MB}' = "$mb"
            '{FULL_GB}' = "$([math]::Round($exe.Length / 1GB, 2))"; '{FULL}' = $exe.Name
            '{MODELS}' = "$env:IN_MODELS"; '{COMMIT}' = $env:GITHUB_SHA.Substring(0, 7)
          }
          foreach ($k in $vals.Keys) { $notes = $notes.Replace($k, $vals[$k]) }
          [System.IO.File]::WriteAllText("notes.md", $notes, (New-Object System.Text.UTF8Encoding($false)))
          gh release create "v$env:VER" @files --title "PCG 會議翻譯 $env:VER" --notes-file notes.md --target $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
