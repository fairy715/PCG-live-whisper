# PCG 集團版：產生 Windows 安裝程式（Setup.exe），並在乾淨的 Windows 上實際安裝、測試一次
# - build：Inno Setup 編譯 Setup.exe，上傳成 Artifact（保留 14 天）
# - e2e：製作離線資源包 → 靜默安裝 → 自我檢查（5 個翻譯方向）→ 語音端到端（Windows 語音合成 → 辨識 → 翻成印尼文）→ 啟動網頁
name: Windows 安裝程式

on:
  push:
    branches: [main]
    paths:
      - "group/**"
      - "translate_meeting.py"
      - "webui.py"
      - "webui.html"
      - ".github/workflows/windows-installer.yml"
  workflow_dispatch:

concurrency:
  group: windows-installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: 安裝 Inno Setup
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          if (-not (Test-Path $iscc)) { throw "找不到 ISCC.exe" }

      - name: 下載安裝畫面的語言檔（繁中、印尼文、越南文、印地語）
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force group/windows/lang | Out-Null
          foreach ($n in 'ChineseTraditional','Indonesian','Vietnamese','Hindi') {
            try {
              Invoke-WebRequest "https://raw.githubusercontent.com/jrsoftware/issrc/main/Files/Languages/Unofficial/$n.isl" -OutFile "group/windows/lang/$n.isl"
              Write-Host "OK  $n"
            } catch { Write-Host "略過 $n（$($_.Exception.Message)）" }
          }

      - name: 編譯 Setup.exe
        shell: pwsh
        run: |
          $v = (Get-Date -Format 'yyyy.M.d') + '.' + $env:GITHUB_RUN_NUMBER
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$v" group\windows\PCG-Setup.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem dist

      - uses: actions/upload-artifact@v4
        with:
          name: PCG-Setup
          path: dist/*.exe
          retention-days: 14

  e2e:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      APP: C:\PCGtest
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: PCG-Setup
          path: dist

      - name: 製作離線資源包
        run: python group/windows/build_bundle.py --out dist/PCG-offline

      - name: 靜默安裝
        shell: pwsh
        run: |
          $exe = Get-ChildItem dist -Filter "PCG-Setup-*.exe" | Select-Object -First 1
          $log = "$env:APP\group_data\install.log"
          Start-Process $exe.FullName -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/DIR=$env:APP",'/LOG=dist\setup.log' -Wait
          # 安裝程式有可能比裡面的 pcg-install.ps1 早結束：等紀錄出現「完成」或「錯誤」（最多 25 分鐘）
          for ($i = 0; $i -lt 300; $i++) {
            if ((Test-Path $log) -and (Select-String -Path $log -Pattern '安裝完成|\[錯誤\]' -Encoding utf8 -Quiet)) { break }
            Start-Sleep -Seconds 5
          }
          Write-Host "===== install.log ====="; Get-Content $log -Encoding utf8
          if (-not (Select-String -Path $log -Pattern '安裝完成' -Encoding utf8 -Quiet)) {
            Write-Host "===== setup.log（最後 60 行）====="; Get-Content dist\setup.log -Tail 60
            exit 1
          }

      - name: 自我檢查（套件、模型、5 個翻譯方向）
        shell: pwsh
        run: |
          $env:HF_HUB_CACHE = "$env:APP\hf_cache"; $env:HF_HUB_OFFLINE = "1"; $env:PYTHONUTF8 = "1"
          $env:PATH = "$env:APP\tools\ffmpeg\bin;" + $env:PATH
          & "$env:APP\python\python.exe" "$env:APP\group\windows\selftest.py"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: 語音端到端（Windows 語音合成 → 辨識 → 翻成印尼文）
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Speech
          $s = New-Object System.Speech.Synthesis.SpeechSynthesizer
          $wav = "$env:APP\e2e_meeting.wav"
          $s.SetOutputToWaveFile($wav)
          $s.Speak("Good morning everyone. Today we will check the inventory of raw materials in the new factory. The machines will be installed next Friday.")
          $s.Dispose()
          $env:HF_HUB_CACHE = "$env:APP\hf_cache"; $env:HF_HUB_OFFLINE = "1"; $env:PYTHONUTF8 = "1"; $env:PYTHONIOENCODING = "utf-8"
          $env:PATH = "$env:APP\tools\ffmpeg\bin;" + $env:PATH
          Push-Location $env:APP
          ("y`n" * 20) | & "$env:APP\python\python.exe" translate_meeting.py --input $wav --mode en2id -e m2m -m small --local-asr --no-vtt
          Pop-Location
          $t = Get-ChildItem "$env:APP\logs" -Recurse -Filter "英翻印尼_時間逐字稿_*.txt" | Select-Object -First 1
          if (-not $t) { Write-Host "找不到逐字稿"; exit 1 }
          Get-Content $t.FullName -Encoding utf8
          if (-not (Select-String -Path $t.FullName -Pattern '\[ID\]' -Encoding utf8 -Quiet)) { Write-Host "逐字稿沒有印尼文譯文"; exit 1 }

      - name: 啟動程式與網頁
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File "$env:APP\group\windows\launch.ps1" -NoBrowser
          foreach ($u in '/simple','/simple/live','/simple/admin','/api/simple/config','/api/simple/live') {
            $r = Invoke-WebRequest "http://127.0.0.1:19781$u" -Headers @{ 'X-Client-Id' = 'ci-test-0001' } -UseBasicParsing
            Write-Host "$u → $($r.StatusCode)"
          }
          $c = Invoke-RestMethod "http://127.0.0.1:19781/api/simple/config" -Headers @{ 'X-Client-Id' = 'ci-test-0001' }
          if ($c.backend -ne 'local') { throw "預設應為本機模式，實際：$($c.backend)" }

      - name: 收集紀錄
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/logs | Out-Null
          Copy-Item dist/setup.log dist/logs/ -ErrorAction SilentlyContinue
          Copy-Item "$env:APP\group_data\*.log" dist/logs/ -ErrorAction SilentlyContinue
          Copy-Item dist/PCG-offline/manifest.json dist/logs/ -ErrorAction SilentlyContinue
          Copy-Item dist/PCG-offline/requirements-lock.txt dist/logs/ -ErrorAction SilentlyContinue
          Get-ChildItem "$env:APP\logs" -Recurse -Include *.txt,*.srt -ErrorAction SilentlyContinue | Copy-Item -Destination dist/logs/

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-logs
          path: dist/logs
          retention-days: 14
