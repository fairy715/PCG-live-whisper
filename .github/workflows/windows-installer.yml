# PCG 集團版：產生 Windows 安裝程式（Setup.exe），並在乾淨的 Windows 上實際安裝、測試一次
# - build：Inno Setup 編譯 Setup.exe，上傳成 Artifact（保留 14 天）
# - e2e：製作離線資源包 → 靜默安裝 → 自我檢查（7 個翻譯方向）→ 語音端到端（Windows 語音合成 → 辨識 → 翻成印尼文）→ 啟動網頁
name: Windows 安裝程式

on:
  push:
    branches: [main]
    paths:
      - "group/**"
      - "translate_meeting.py"
      - "webui.py"
      - "webui.html"
      - ".github/workflows/windows-installer.yml"
  workflow_dispatch:

concurrency:
  group: windows-installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: 安裝 Inno Setup
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          if (-not (Test-Path $iscc)) { throw "找不到 ISCC.exe" }

      - name: 下載安裝畫面的語言檔（繁中、印尼文、越南文、印地語）
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force group/windows/lang | Out-Null
          foreach ($n in 'ChineseTraditional','Indonesian','Vietnamese','Hindi') {
            try {
              Invoke-WebRequest "https://raw.githubusercontent.com/jrsoftware/issrc/main/Files/Languages/Unofficial/$n.isl" -OutFile "group/windows/lang/$n.isl"
              Write-Host "OK  $n"
            } catch { Write-Host "略過 $n（$($_.Exception.Message)）" }
          }

      - name: 編譯 Setup.exe
        shell: pwsh
        run: |
          $v = (Get-Date -Format 'yyyy.M.d') + '.' + $env:GITHUB_RUN_NUMBER
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$v" group\windows\PCG-Setup.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem dist

      - uses: actions/upload-artifact@v4
        with:
          name: PCG-Setup
          path: dist/*.exe
          retention-days: 14

  e2e:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      APP: C:\PCGtest
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: PCG-Setup
          path: dist

      - name: 製作離線資源包
        run: python group/windows/build_bundle.py --out dist/PCG-offline

      - name: 靜默安裝
        shell: pwsh
        run: |
          $exe = Get-ChildItem dist -Filter "PCG-Setup-*.exe" | Select-Object -First 1
          $log = "$env:APP\group_data\install.log"
          # 安裝畫面的進度（r18）：安裝時每秒讀一次 install-progress.txt，記下看到的內容
          $prog = "$env:APP\group_data\install-progress.txt"
          $seen = [System.Collections.Generic.List[string]]::new()
          $proc = Start-Process $exe.FullName -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/DIR=$env:APP",'/LOG=dist\setup.log' -PassThru
          while (-not $proc.HasExited) {
            try { $v = (Get-Content $prog -Raw -ErrorAction Stop).Trim(); if ($v -and ($seen.Count -eq 0 -or $seen[$seen.Count - 1] -ne $v)) { $seen.Add($v) } } catch { }
            Start-Sleep -Milliseconds 1000
          }
          # 安裝程式有可能比裡面的 pcg-install.ps1 早結束：等紀錄出現「完成」或「錯誤」（最多 25 分鐘）
          for ($i = 0; $i -lt 300; $i++) {
            if ((Test-Path $log) -and (Select-String -Path $log -Pattern '安裝完成|\[錯誤\]' -Encoding utf8 -Quiet)) { break }
            Start-Sleep -Seconds 5
          }
          Write-Host "===== install.log ====="; Get-Content $log -Encoding utf8
          if (-not (Select-String -Path $log -Pattern '安裝完成' -Encoding utf8 -Quiet)) {
            Write-Host "===== setup.log（最後 60 行）====="; Get-Content dist\setup.log -Tail 60
            exit 1
          }
          # 進度：要看到「第 2 步」（裝套件）而且數得到已裝的套件；結束後進度檔要刪掉；安裝畫面的程式不能出錯
          Write-Host "安裝畫面看到的進度（$($seen.Count) 種）：$($seen -join ' | ')"
          $pkg = @($seen | Where-Object { $_ -match '^2 4 (\d+) (\d+)$' -and [int]$Matches[2] -gt 0 -and [int]$Matches[1] -gt 0 })
          if (-not $pkg) { throw "安裝時沒有看到套件安裝的進度" }
          if (-not ($seen | Where-Object { $_ -match '^[34] 4 ' })) { throw "安裝時沒有看到模型或自我檢查的步驟" }
          if (Test-Path $prog) { throw "安裝完成後進度檔沒有刪掉" }
          if (Select-String -Path dist\setup.log -Pattern 'Runtime error|Exception' -Quiet) {
            Get-Content dist\setup.log -Tail 60; throw "安裝畫面的程式（Pascal Script）出錯"
          }

      - name: 自我檢查（套件、模型、7 個翻譯方向）
        shell: pwsh
        run: |
          $env:HF_HUB_CACHE = "$env:APP\hf_cache"; $env:HF_HUB_OFFLINE = "1"; $env:PYTHONUTF8 = "1"
          $env:PATH = "$env:APP\tools\ffmpeg\bin;" + $env:PATH
          & "$env:APP\python\python.exe" "$env:APP\group\windows\selftest.py"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: 語音端到端（Windows 語音合成 → 辨識 → 翻成印尼文）
        timeout-minutes: 15
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Speech
          $s = New-Object System.Speech.Synthesis.SpeechSynthesizer
          $wav = "$env:APP\e2e_meeting.wav"
          $s.SetOutputToWaveFile($wav)
          $s.Speak("Good morning everyone. Today we will check the inventory of raw materials in the new factory. The machines will be installed next Friday.")
          $s.Dispose()
          Write-Host ("語音檔：{0:N0} bytes" -f (Get-Item $wav).Length)
          $env:HF_HUB_CACHE = "$env:APP\hf_cache"; $env:HF_HUB_OFFLINE = "1"; $env:PCG_NONINTERACTIVE = "1"
          $env:PATH = "$env:APP\tools\ffmpeg\bin;" + $env:PATH
          Set-Content -Path "$env:APP\yes.txt" -Value (@("y") * 30) -Encoding ascii
          # 最多 10 分鐘：卡住時強制結束並印出最後的輸出，才看得出卡在哪裡
          $p = Start-Process "$env:APP\python\python.exe" -WorkingDirectory $env:APP -NoNewWindow -PassThru `
            -ArgumentList @("translate_meeting.py", "--input", "`"$wav`"", "--mode", "en2id", "-e", "m2m", "-m", "small", "--local-asr", "--no-vtt") `
            -RedirectStandardInput "$env:APP\yes.txt" -RedirectStandardOutput "$env:APP\e2e_out.txt" -RedirectStandardError "$env:APP\e2e_err.txt"
          $done = $p.WaitForExit(600000)
          if (-not $done) { Write-Host "===== 逾時 10 分鐘，強制結束 ====="; Stop-Process -Id $p.Id -Force }
          Write-Host "===== 輸出（最後 80 行）====="; Get-Content "$env:APP\e2e_out.txt" -Tail 80 -Encoding utf8
          Write-Host "===== 錯誤輸出（最後 40 行）====="; Get-Content "$env:APP\e2e_err.txt" -Tail 40 -Encoding utf8
          if (-not $done) { exit 1 }
          $t = Get-ChildItem "$env:APP\logs" -Recurse -Filter "英翻印尼_時間逐字稿_*.txt" | Select-Object -First 1
          if (-not $t) { Write-Host "找不到逐字稿"; exit 1 }
          Write-Host "===== 逐字稿 ====="; Get-Content $t.FullName -Encoding utf8
          if (-not (Select-String -Path $t.FullName -Pattern '\[ID\]' -Encoding utf8 -Quiet)) { Write-Host "逐字稿沒有印尼文譯文"; exit 1 }

      - name: 啟動程式與網頁
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File "$env:APP\group\windows\launch.ps1" -NoBrowser
          foreach ($u in '/simple','/simple/live','/simple/admin','/api/simple/config','/api/simple/live') {
            $r = Invoke-WebRequest "http://127.0.0.1:19781$u" -Headers @{ 'X-Client-Id' = 'ci-test-0001' } -UseBasicParsing
            Write-Host "$u → $($r.StatusCode)"
          }
          $h = @{ 'X-Client-Id' = 'ci-test-0001' }
          $c = Invoke-RestMethod "http://127.0.0.1:19781/api/simple/config" -Headers $h
          if ($c.backend -ne 'local') { throw "預設應為本機模式，實際：$($c.backend)" }
          # 用簡易頁面的佇列實際處理一段錄音（同仁「錄音 → 會議紀錄」的完整路徑）
          if (-not (Test-Path "$env:APP\e2e_meeting.wav")) {
            Add-Type -AssemblyName System.Speech
            $s = New-Object System.Speech.Synthesis.SpeechSynthesizer
            $s.SetOutputToWaveFile("$env:APP\e2e_meeting.wav"); $s.Speak("We will check the inventory tomorrow morning."); $s.Dispose()
          }
          $r = Invoke-RestMethod "http://127.0.0.1:19781/api/simple/jobs" -Method Post -Headers $h `
            -Form @{ file = Get-Item "$env:APP\e2e_meeting.wav"; scenario = 'en2zh'; topic = 'CI' }
          Write-Host "送出工作 $($r.id)"
          $job = $null
          for ($i = 0; $i -lt 96; $i++) {
            Start-Sleep -Seconds 5
            $job = (Invoke-RestMethod "http://127.0.0.1:19781/api/simple/jobs" -Headers $h).jobs | Where-Object { $_.id -eq $r.id }
            if ($job.state -in 'done','failed','cancelled') { break }
          }
          $job | ConvertTo-Json -Depth 5
          if ($job.state -ne 'done') {
            Get-Content "$env:APP\group_data\job_$($r.id).log" -Tail 60 -Encoding utf8 -ErrorAction SilentlyContinue
            throw "簡易頁面的工作沒有完成：$($job.state) $($job.error)"
          }
          if (-not $job.outputs) { throw "工作完成但沒有產出檔" }

      - name: 收集紀錄
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/logs | Out-Null
          Copy-Item dist/setup.log dist/logs/ -ErrorAction SilentlyContinue
          Copy-Item "$env:APP\group_data\*.log" dist/logs/ -ErrorAction SilentlyContinue
          Copy-Item dist/PCG-offline/manifest.json dist/logs/ -ErrorAction SilentlyContinue
          Copy-Item dist/PCG-offline/requirements-lock.txt dist/logs/ -ErrorAction SilentlyContinue
          Get-ChildItem "$env:APP\logs" -Recurse -Include *.txt,*.srt -ErrorAction SilentlyContinue | Copy-Item -Destination dist/logs/

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-logs
          path: dist/logs
          retention-days: 14
