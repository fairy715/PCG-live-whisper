<!DOCTYPE html>
<!-- PCG 集團版：給一般同仁用的簡易頁面。後端見 group/simple_routes.py。
     多國語言：所有文字在下方 I18N 對照表（zh 繁體中文、en、id 印尼文、vi 越南文、hi 印地語）；
     新增語言只要在 I18N 加一組、在 LANGS 加一列 -->
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PCG Meeting Translator</title>
<link rel="icon" href="/favicon.png">
<style>
:root{
  --bg:#f5f6f8;--card:#fff;--text:#1d2330;--dim:#5d6676;--line:#dde1e7;
  --accent:#1f6feb;--accent-ink:#fff;--accent-soft:#e7f0ff;
  --ok:#1a7f37;--ok-soft:#e6f4ea;--warn:#9a6700;--warn-soft:#fff4d6;--err:#cf222e;--err-soft:#ffebe9;
  --radius:14px;--shadow:0 1px 3px rgba(0,0,0,.06),0 4px 16px rgba(0,0,0,.04);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0f1218;--card:#171b23;--text:#e6e9ef;--dim:#98a1b2;--line:#2a303b;
  --accent:#4c8dff;--accent-ink:#0b0e13;--accent-soft:#1a2740;
  --ok:#4ac26b;--ok-soft:#14261b;--warn:#d4a72c;--warn-soft:#2a2310;--err:#ff6b6b;--err-soft:#2d1517;
  --shadow:none;
}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);
  font:16px/1.6 -apple-system,"Segoe UI","PingFang TC","Microsoft JhengHei","Noto Sans TC","Noto Sans Devanagari","Nirmala UI",sans-serif}
.wrap{max-width:860px;margin:0 auto;padding:24px 16px 64px}
header{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:20px}
header h1{font-size:22px;margin:0;font-weight:700}
header .sub{color:var(--dim);font-size:14px}
header .scope{margin-top:4px}
/* r30：資料會送出公司時，這一行用專屬的樣式（左邊粗色條），和「有新版本」這類一般提示區分開 */
header .scope.ext{display:inline-block;margin-top:6px;padding:6px 10px;border-left:5px solid var(--warn,#9a6700);border-radius:8px;background:var(--warn-soft,#fff8e6);color:var(--warn,#9a6700);font-weight:700}
.lang{flex:none;display:flex;align-items:center;gap:6px;color:var(--dim);font-size:14px}
.lang select{font:inherit;color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px 8px}
.tabs{display:flex;flex-wrap:wrap;gap:0 16px;margin-bottom:20px;border-bottom:1px solid var(--line)}
.tab{appearance:none;background:none;border:0;border-bottom:3px solid transparent;padding:10px 6px;
  font:inherit;font-size:17px;font-weight:600;color:var(--dim);cursor:pointer}
.tab[aria-selected=true]{color:var(--text);border-bottom-color:var(--accent)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;margin-bottom:16px}
.step{font-size:15px;font-weight:700;margin:0 0 12px;display:flex;align-items:center;gap:8px}
.step b{flex:none;display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.opt{position:relative;display:flex;gap:12px;align-items:center;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;cursor:pointer;background:var(--card)}
.opt input{position:absolute;opacity:0;pointer-events:none}
.opt:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.opt:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:2px}
.flag{flex:none;display:grid;place-items:center;width:40px;height:40px;border-radius:10px;background:var(--bg);font-weight:700;font-size:14px}
.opt .t{font-weight:600;line-height:1.3}
.opt .s{color:var(--dim);font-size:13px;line-height:1.3}
.drop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:130px;border:2px dashed var(--line);
  border-radius:12px;text-align:center;padding:16px;cursor:pointer;color:var(--dim)}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop .big{font-size:17px;color:var(--text);font-weight:600;word-break:break-all}
.drop.has .big{color:var(--accent)}
label.field{display:block;margin-top:14px;font-size:14px;color:var(--dim)}
input[type=text],input[type=number],input[type=password]{width:100%;margin-top:6px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;
  background:var(--bg);color:var(--text);font:inherit}
.row{display:flex;gap:12px;flex-wrap:wrap}
.row>label{flex:1 1 220px}
.check{display:flex;gap:10px;align-items:flex-start;margin-top:14px;cursor:pointer}
.linkbtn{background:none;border:0;color:var(--accent);font:inherit;font-size:14px;cursor:pointer;padding:8px 0 0;text-decoration:underline}
.step.next{margin-top:22px}
.check input{width:20px;height:20px;margin-top:3px;flex:none}
.check small{display:block;color:var(--dim);font-size:13px}
.btn{appearance:none;border:0;border-radius:12px;padding:14px 22px;font:inherit;font-weight:700;font-size:17px;cursor:pointer;
  background:var(--accent);color:var(--accent-ink);width:100%;margin-top:18px}
.btn:disabled{background:#8a94a3;border-color:#8a94a3;color:#fff;cursor:not-allowed}
.btn.ghost:disabled{background:none;color:#6b7684;border-color:#b9c0cb}
.btn.off{background:#6b7684}
.btn.ghost{background:none;color:var(--accent);border:1.5px solid var(--accent);width:auto;font-size:15px;padding:8px 14px;margin:0}
.btn.small{width:auto;font-size:14px;padding:8px 14px;margin:0}
.note{font-size:14px;color:var(--dim);margin:8px 0 0}
.banner{border-radius:12px;padding:12px 14px;font-size:15px;margin-bottom:16px}
.banner.info{background:var(--accent-soft)}
.banner.warn{background:var(--warn-soft);color:var(--warn)}
.banner.err{background:var(--err-soft);color:var(--err)}
.banner.ok{background:var(--ok-soft);color:var(--text)}
.banner.upd{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between}
.upd-actions{display:flex;gap:12px;align-items:center}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:12px;display:none}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
.jobs h2{font-size:18px;margin:28px 0 12px}
.job{display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:start}
.job .name{font-weight:600;word-break:break-all}
.job .meta{color:var(--dim);font-size:13px}
.chip{display:inline-block;border-radius:999px;padding:3px 10px;font-size:13px;font-weight:600}
.chip.queued{background:var(--bg);color:var(--dim)}
.chip.running{background:var(--accent-soft);color:var(--accent)}
.chip.done{background:var(--ok-soft);color:var(--ok)}
.chip.failed,.chip.cancelled{background:var(--err-soft);color:var(--err)}
.outs{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.outs a{display:inline-block;padding:8px 12px;border-radius:10px;border:1px solid var(--line);color:var(--text);text-decoration:none;font-size:14px}
.outs a.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.err-msg{grid-column:1/-1;color:var(--err);font-size:14px}
.err-msg small{display:block;color:var(--dim)}
.empty{color:var(--dim);text-align:center;padding:24px}
dialog{border:0;border-radius:var(--radius);padding:24px;background:var(--card);color:var(--text);width:min(380px,92vw)}
dialog::backdrop{background:rgba(0,0,0,.4)}
#repDlg,#updDlg{width:min(480px,94vw)}
#updDlg ul{margin:6px 0 0;padding-left:20px;line-height:1.6}
#updDlg li{margin:4px 0}
#updDlg .b{display:flex;gap:10px;justify-content:flex-end;align-items:center;margin-top:16px;flex-wrap:wrap}
#updDlg .b .btn{width:auto}
#updDlg .b a{margin-right:auto;font-size:14px}
#repDesc{width:100%;min-height:96px;font:inherit;padding:8px;border:1px solid var(--line,#ccc);border-radius:8px;box-sizing:border-box;background:var(--card);color:var(--text)}
#repDlg .b{display:flex;gap:10px;justify-content:flex-end;margin-top:14px}
/* 聲音與麥克風（r24） */
#audDlg{width:min(480px,94vw)}
#audDlg .b{display:flex;gap:10px;justify-content:flex-end;margin-top:16px}
#audDlg .b .btn{width:auto;white-space:nowrap}#audDlg .b .btn:not(.ghost){flex:1}
#audDlg select{font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px;width:100%;margin-top:4px}
#audDlg h4{margin:16px 0 6px;font-size:15px}
.meter{height:12px;border-radius:999px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;width:0;background:var(--accent);border-radius:999px;transition:width .12s linear}
.audst{font-size:13px;margin:6px 0 0;color:var(--dim)}
.audst.ok{color:var(--ok)}.audst.bad{color:var(--err)}
#audDlg details{margin-top:8px;font-size:14px;color:var(--dim)}#audDlg summary{cursor:pointer}
#repDlg .b .btn{width:auto}
#repRes{margin-top:12px}
.hdr-right{flex:none;display:flex;align-items:center;gap:8px}
.foot{margin-top:28px;text-align:center;font-size:13px;color:var(--dim)}.foot a{color:var(--dim)}
.ver{color:var(--dim);font-size:12px;cursor:copy;user-select:all}
/* 導覽 */
.tour-spot{position:fixed;z-index:50;border-radius:12px;box-shadow:0 0 0 4px var(--accent),0 0 0 9999px rgba(0,0,0,.55);pointer-events:none;transition:all .25s}
.tour-tip{position:fixed;z-index:51;width:min(340px,calc(100vw - 32px));background:var(--card);color:var(--text);border-radius:14px;padding:16px;box-shadow:0 8px 30px rgba(0,0,0,.3)}
.tour-tip p{margin:0 0 12px;font-size:15px}
.tour-tip .n{color:var(--dim);font-size:13px}
.tour-tip .b{display:flex;gap:8px;align-items:center;justify-content:flex-end;flex-wrap:wrap}
.tour-tip .b .skip{margin-right:auto;background:none;border:0;color:var(--dim);font:inherit;font-size:14px;cursor:pointer;padding:6px}
[hidden]{display:none!important}
/* r29：場合的圖示改成內嵌的單色 SVG（emoji 在 Windows 10／11 長得不一樣）；開始前的確認句、摘要卡、狀態圖示 */
.opt .ico{flex:none;display:grid;place-items:center;width:40px;height:40px;border-radius:10px;background:var(--bg);color:var(--accent)}
.opt .ico svg{width:24px;height:24px}
.opt .tx{display:flex;flex-direction:column;gap:2px;min-width:0}.opt .tx .t,.opt .tx .s{display:block;line-height:1.3}
.lnk-ico{display:inline-flex;align-items:center;gap:6px}.lnk-ico svg{width:18px;height:18px;flex:none}
.lang svg{width:18px;height:18px;color:var(--dim);vertical-align:middle}
.sumline{margin:16px 0 0;padding:10px 12px;border-radius:10px;background:var(--accent-soft);font-weight:600;font-size:15px;line-height:1.5}
.need{color:var(--warn);font-weight:600}
#lastTrWhat{font:inherit;color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px 8px;max-width:60vw}
/* r32：這場會議的資料 */
.notesW{margin-top:6px}.notesW .field{margin-top:10px;color:var(--text);font-weight:600}
.notesTa{display:block;width:100%;min-height:104px;font:inherit;padding:10px;border:1.5px solid var(--line);border-radius:10px;box-sizing:border-box;background:var(--card);color:var(--text);margin-top:6px;resize:vertical}
.quick{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 14px;border:1.5px solid var(--accent);border-radius:12px;background:var(--accent-soft)}
.quick b{font-size:16px;line-height:1.4}.quick .linkbtn{margin-left:auto;padding:0}
.busy{display:inline-flex;align-items:center;gap:8px;justify-content:center}
.chip .ul-i{--ul-size:16px;margin-right:4px}
.flash{animation:pcg-flash .9s ease-out 2}
@keyframes pcg-flash{0%{box-shadow:0 0 0 0 var(--accent)}100%{box-shadow:0 0 0 12px transparent}}
@media (prefers-reduced-motion:reduce){.flash{animation:none;outline:2px solid var(--accent)}}
/* ul-icons:begin — Ultra Lab Motion Icons v0.3.1（MIT License，(c) Ultra Lab，https://github.com/ppcvote/ultralab-anim-icons）。
   只取用到的幾個圖示，內嵌在這裡（公司電腦可能不能上網）；只用在「狀態」，系統開了「減少動態效果」時不會動 */
.ul-i{width:var(--ul-size,24px);height:var(--ul-size,24px);stroke-width:var(--ul-stroke,1.5);overflow:visible;vertical-align:middle;flex:none}
.ul-i *{transform-box:view-box;transform-origin:12px 12px}
@media (prefers-reduced-motion:reduce){.ul-i *{animation:none!important}}
.ul-loading-orbit .g{animation:ul-loading-orbit-spin calc(1.6s / var(--ul-speed,1)) linear calc(0s / var(--ul-speed,1)) infinite;animation-play-state:var(--ul-play,running)}.ul-loading-orbit .a{animation:ul-loading-orbit-arc calc(2.8000000000000003s / var(--ul-speed,1)) ease-in-out calc(0s / var(--ul-speed,1)) infinite;animation-play-state:var(--ul-play,running)}@keyframes ul-loading-orbit-spin{to{transform:rotate(360deg)}}@keyframes ul-loading-orbit-arc{from{stroke-dashoffset:55}to{stroke-dashoffset:-125}}
.ul-listen .g1{animation:ul-listen-lv calc(1.8s / var(--ul-speed,1)) ease-in-out calc(0s / var(--ul-speed,1)) infinite;animation-play-state:var(--ul-play,running)}.ul-listen .g2{animation:ul-listen-lv calc(1.8s / var(--ul-speed,1)) ease-in-out calc(-1.62s / var(--ul-speed,1)) infinite;animation-play-state:var(--ul-play,running)}.ul-listen .e{transform-origin:12px 11.5px;animation:ul-listen-echo calc(1.8s / var(--ul-speed,1)) ease-out calc(0s / var(--ul-speed,1)) infinite;animation-play-state:var(--ul-play,running)}@keyframes ul-listen-lv{0%,55%,100%{opacity:.3}25%{opacity:1}}@keyframes ul-listen-echo{0%{opacity:0;transform:scale(1)}12%{opacity:.6}70%,100%{opacity:0;transform:scale(1.25)}}
.ul-translate .p{animation:ul-translate-p calc(3.6s / var(--ul-speed,1)) ease-in-out calc(0s / var(--ul-speed,1)) infinite;animation-play-state:var(--ul-play,running)}.ul-translate .q{animation:ul-translate-q calc(3.6s / var(--ul-speed,1)) ease-in-out calc(0s / var(--ul-speed,1)) infinite;animation-play-state:var(--ul-play,running)}@keyframes ul-translate-p{0%,15%{transform:translate(0,0)}45%,65%{transform:translate(8px,8px)}95%,100%{transform:translate(0,0)}}@keyframes ul-translate-q{0%,15%{transform:translate(0,0)}45%,65%{transform:translate(-8px,-8px)}95%,100%{transform:translate(0,0)}}
.ul-summarize .l1{animation:ul-summarize-l1 calc(3.6s / var(--ul-speed,1)) ease-in-out calc(0s / var(--ul-speed,1)) infinite;animation-play-state:var(--ul-play,running)}@keyframes ul-summarize-l1{0%,8%{opacity:1;transform:translateY(0) scaleX(1)}38%,68%{opacity:0;transform:translateY(6px) scaleX(.5)}92%,100%{opacity:1;transform:translateY(0) scaleX(1)}}.ul-summarize .l2{animation:ul-summarize-l2 calc(3.6s / var(--ul-speed,1)) ease-in-out calc(0s / var(--ul-speed,1)) infinite;animation-play-state:var(--ul-play,running)}@keyframes ul-summarize-l2{0%,8%{opacity:1;transform:translateY(0) scaleX(1)}38%,68%{opacity:0;transform:translateY(2px) scaleX(.5)}92%,100%{opacity:1;transform:translateY(0) scaleX(1)}}.ul-summarize .l3{animation:ul-summarize-l3 calc(3.6s / var(--ul-speed,1)) ease-in-out calc(0s / var(--ul-speed,1)) infinite;animation-play-state:var(--ul-play,running)}@keyframes ul-summarize-l3{0%,8%{opacity:1;transform:translateY(0) scaleX(1)}38%,68%{opacity:0;transform:translateY(-2px) scaleX(.5)}92%,100%{opacity:1;transform:translateY(0) scaleX(1)}}.ul-summarize .l4{animation:ul-summarize-l4 calc(3.6s / var(--ul-speed,1)) ease-in-out calc(0s / var(--ul-speed,1)) infinite;animation-play-state:var(--ul-play,running)}@keyframes ul-summarize-l4{0%,8%{opacity:1;transform:translateY(0) scaleX(1)}38%,68%{opacity:0;transform:translateY(-6px) scaleX(.5)}92%,100%{opacity:1;transform:translateY(0) scaleX(1)}}.ul-summarize .r{animation:ul-summarize-r calc(3.6s / var(--ul-speed,1)) ease-in-out calc(0s / var(--ul-speed,1)) infinite;animation-play-state:var(--ul-play,running)}@keyframes ul-summarize-r{0%,30%{opacity:0;transform:scaleX(.6)}42%,64%{opacity:1;transform:scaleX(1)}74%,100%{opacity:0;transform:scaleX(.6)}}
.ul-sync .g{animation:ul-sync-turn calc(2.4s / var(--ul-speed,1)) cubic-bezier(.65,0,.35,1) calc(0s / var(--ul-speed,1)) infinite;animation-play-state:var(--ul-play,running)}@keyframes ul-sync-turn{0%{transform:rotate(0)}55%,100%{transform:rotate(180deg)}}
.ul-upload .a{animation:ul-upload-up calc(2.2s / var(--ul-speed,1)) ease-in-out calc(0s / var(--ul-speed,1)) infinite;animation-play-state:var(--ul-play,running)}@keyframes ul-upload-up{0%{opacity:0;transform:translateY(3px)}22%,62%{opacity:1;transform:translateY(0)}88%,100%{opacity:0;transform:translateY(-4px)}}
.ul-download .a{animation:ul-download-down calc(2.2s / var(--ul-speed,1)) ease-in-out calc(0s / var(--ul-speed,1)) infinite;animation-play-state:var(--ul-play,running)}.ul-download .t{animation:ul-download-dip calc(2.2s / var(--ul-speed,1)) ease-in-out calc(0s / var(--ul-speed,1)) infinite;animation-play-state:var(--ul-play,running)}@keyframes ul-download-down{0%{opacity:0;transform:translateY(-4px)}25%,60%{opacity:1;transform:translateY(0)}82%,100%{opacity:0;transform:translateY(3px)}}@keyframes ul-download-dip{0%,70%,100%{transform:translateY(0)}80%{transform:translateY(1px)}}
.ul-connecting .o1{animation:ul-connecting-cw calc(3.6s / var(--ul-speed,1)) linear calc(0s / var(--ul-speed,1)) infinite;animation-play-state:var(--ul-play,running)}.ul-connecting .o2{animation:ul-connecting-ccw calc(2.16s / var(--ul-speed,1)) linear calc(0s / var(--ul-speed,1)) infinite;animation-play-state:var(--ul-play,running)}@keyframes ul-connecting-cw{to{transform:rotate(360deg)}}@keyframes ul-connecting-ccw{to{transform:rotate(-360deg)}}
/* ul-icons:end */
@media (max-width:520px){.grid{grid-template-columns:1fr 1fr}.opt{padding:10px;gap:8px}.flag{width:34px;height:34px}header{flex-direction:column}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1 data-t="title"></h1>
      <div class="sub" data-t="tagline"></div>
      <div class="sub scope" id="scope" hidden></div>
    </div>
    <div class="hdr-right">
      <button class="btn ghost small" id="tourBtn" type="button" data-t="tour_btn"></button>
      <label class="lang"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg>
        <select id="langSel" aria-label="Language"></select></label>
    </div>
  </header>

  <div id="updBox" class="banner info upd" hidden>
    <span id="updMsg"></span>
    <span class="upd-actions"><button class="btn small" id="updBtn" type="button"></button>
      <a id="updNotes" target="_blank" rel="noopener" hidden data-t="upd_notes"></a></span>
  </div>

  <div class="tabs" role="tablist">
    <button class="tab" role="tab" id="tabLive" aria-controls="pLive" aria-selected="false" data-t="tab_live"></button>
    <button class="tab" role="tab" id="tabFile" aria-controls="pFile" aria-selected="false" data-t="tab_file"></button>
  </div>

  <!-- 即時字幕 -->
  <section id="pLive" role="tabpanel" hidden>
    <div id="liveRemote" class="banner warn" hidden data-t-html="live_remote"></div>
    <div id="liveRunning" class="banner info" hidden>
      <span data-t="live_running"></span> <button class="btn ghost" id="openLive" type="button" data-t="open_live"></button>
      <button class="btn ghost" id="stopLive" type="button" data-t="stop_live"></button>
    </div>
    <!-- r33：上一場即時字幕的逐字稿（只在收音的這台電腦、字幕沒有在跑時顯示） -->
    <div id="lastTr" class="banner info" hidden>
      <span id="lastTrText"></span> <select id="lastTrWhat" hidden aria-label="Transcript"></select> <a class="btn ghost" id="lastTrDl" download data-t="ltr_dl"></a>
      <button class="btn ghost" id="lastTrMin" type="button" hidden data-t="ltr_min"></button>
    </div>
    <div id="liveForm">
      <div class="card">
        <div id="quickBox" hidden>
          <p class="step"><span data-t="quick_title"></span></p>
          <div class="quick"><b id="quickLine"></b><button class="linkbtn" id="quickEdit" type="button" data-t="quick_edit"></button></div>
        </div>

const $=id=>document.getElementById(id);
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
function pickLang(){
  const saved=store.get('pcg_lang');if(saved&&I18N[saved])return saved;
  for(const l of navigator.languages||[navigator.language||'']){const c=(l||'').toLowerCase().split('-')[0];if(I18N[c])return c}
  return 'zh';
}
let lang=pickLang();
const t=(k,v={})=>String((I18N[lang]&&I18N[lang][k])??I18N.zh[k]??k).replace(/\{(\w+)\}/g,(_,x)=>v[x]??'');
const locale=()=>(LANGS.find(l=>l[0]===lang)||LANGS[0])[2];
function applyLang(){
  document.documentElement.lang=lang==='zh'?'zh-Hant':lang;
  document.title=t('title');
  document.querySelectorAll('[data-t]').forEach(el=>{el.textContent=t(el.dataset.t)});
  document.querySelectorAll('[data-t-html]').forEach(el=>{el.innerHTML=t(el.dataset.tHtml)});   // 只放對照表裡自己寫的 HTML
  document.querySelectorAll('[data-t-ph]').forEach(el=>{el.placeholder=t(el.dataset.tPh)});
  lastTrPaint();renderScenarios();setFile(file);renderJobs();
  if(!$('tourTip').hidden)tourShow();
}
const sel=$('langSel');
sel.innerHTML=LANGS.map(([c,n])=>`<option value="${c}">${n}</option>`).join('');
sel.value=lang;
sel.onchange=()=>{lang=sel.value;store.set('pcg_lang',lang);applyLang()};

let clientId=store.get('pcg_client');
if(!clientId||!/^[A-Za-z0-9_-]{8,64}$/.test(clientId)){clientId=Array.from(crypto.getRandomValues(new Uint8Array(12)),b=>b.toString(16).padStart(2,'0')).join('');store.set('pcg_client',clientId)}
let token=store.get('pcg_token')||'';
const hdr=()=>({'X-Client-Id':clientId,'X-Simple-Token':token});
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const errText=j=>j&&j.code&&I18N.zh['e_'+j.code]?t('e_'+j.code):(lang==='zh'&&j&&j.error?j.error:t('e_generic'));

async function api(path,opt={}){
  let r;
  try{r=await fetch(path,{...opt,headers:{...hdr(),...(opt.headers||{})}})}catch(e){return{ok:false,code:'network'}}
  const j=await r.json().catch(()=>({ok:false,code:'network'}));
  if(r.status===401&&j.need_password){await askPassword();return api(path,opt)}
  return j;
}
function askPassword(){
  return new Promise(res=>{
    const d=$('pwDlg');$('pwErr').hidden=!token;$('pwInput').value='';d.showModal();
    $('pwForm').onsubmit=()=>{token=$('pwInput').value;store.set('pcg_token',token);res()};
  });
}

let upd=null;
function updShow(kind,msg,busy){const b=$('updBox');b.hidden=false;b.className='banner upd '+kind;const m=$('updMsg');m.textContent=msg;if(busy)m.insertAdjacentHTML('afterbegin',ULI.download+' ')}
async function updCheck(force,quiet){
  let j;try{j=await(await fetch('/api/simple/update'+(force?'?force=1':''))).json()}catch(e){if(force)alert(t('upd_none',{c:'?'}));return}
  if(force&&j.ok&&j.enabled===false){alert(t('upd_off'));return}
  if(!j.ok||!j.enabled||!j.available||!j.latest){if(force&&j.ok)alert(t('upd_none',{c:j.current||''}));return}
  upd=j;const v=j.latest.version;
  if(!force&&!quiet)updPopup(j);
  const n=$('updNotes');n.hidden=!j.latest.notes_url;if(j.latest.notes_url)n.href=j.latest.notes_url;
  if(j.latest.kind!=='patch'){updShow('info',t('upd_full',{v}));$('updBtn').hidden=true;return}
  updShow('info',t('upd_avail',{v,c:j.current}));
  const b=$('updBtn');b.hidden=false;b.textContent=t(j.who==='it'?'upd_it_btn':'upd_btn');b.onclick=updRun;
}
/* 新版本視窗：這個瀏覽器每次打開（新的工作階段）跳一次；「下次再說」或關掉之後，上方照舊有更新提示 */
function updPopup(j){
  const v=j.latest.version,k='pcg_upd_pop_'+v;

async function updRun(){

  const b=$('updBtn');b.disabled=true;
  let j;try{j=await(await fetch('/api/simple/update',{method:'POST',headers:h,body:'{}'})).json()}catch(e){j={ok:false,error:'network'}}
  if(!j.ok){b.disabled=false;updShow('warn',j.code==='update_busy'?t('upd_busy'):t('upd_failed',{e:j.error||j.code||''}));return}
  b.hidden=true;$('updNotes').hidden=true;updShow('warn',t('upd_running',{v}),true);
  // 小更新包會關掉程式、換檔、自我檢查、重新開啟：等到伺服器回來而且版本變了就重新整理
  const end=Date.now()+4*60*1000;
  const tick=async()=>{
    try{const c=await(await fetch('/api/simple/update')).json();if(c.ok&&c.current===v){location.reload();return}}catch(e){}
    if(Date.now()>end){updShow('err',t('upd_timeout'));return}
    setTimeout(tick,3000);
  };
  setTimeout(tick,8000);
}

let audState=null,audTimer=null,audCtx=null;
function audFill(sel,list,saved,autoKey,def){
  const opts=[['',t(autoKey,{n:def||t('aud_auto_none')})]].concat((list||[]).map(d=>[d.name,d.name]));
  if(saved&&!opts.some(o=>o[0]===saved))opts.push([saved,t('aud_missing',{n:saved})]);

function audBars(j){

  $('audSysBar').style.width=w(j&&j.system&&j.system.level);$('audMicBar').style.width=w(j&&j.mic&&j.mic.level);
}
function audStatus(el,lv,okKey,noKey,done){
  let k='aud_wait',cls='';
  if(lv&&lv.error){k=lv.error==='unsupported'?'aud_sys_unsupported':'aud_err';cls='bad'}
  else if(lv&&lv.max>0.01){k=okKey;cls='ok'}
  else if(done){k=noKey;cls='bad'}
  el.className='audst '+cls;el.textContent=t(k,{m:lv&&lv.error||''});
}
function audBeep(){   // 播一小段提示音：聲音從喇叭出來，測得到「電腦播放的聲音」有沒有被收到
  try{
    audCtx=audCtx||new (window.AudioContext||window.webkitAudioContext)();
    const now=audCtx.currentTime;
    for(const [f,at] of [[660,0.3],[880,1.0],[660,1.7],[880,2.4]]){
      const o=audCtx.createOscillator(),g=audCtx.createGain();o.frequency.value=f;o.connect(g);g.connect(audCtx.destination);
      g.gain.setValueAtTime(0,now+at);g.gain.linearRampToValueAtTime(0.25,now+at+0.05);g.gain.linearRampToValueAtTime(0,now+at+0.5);
      o.start(now+at);o.stop(now+at+0.55);
    }
  }catch(e){}
}

  $('audAdv').open=!!j.speaker;$('audAdv').hidden=!(j.speakers||[]).length&&!j.speaker;

    // 語音辨識 API（r24）：聲音送到公司外部時優先提醒；只接內部辨識服務、其他都在本機時說明在公司內部處理
    e.dataset.t=cfg.asr_scope==='external'?'scope_asr_external':(cfg.asr_scope==='internal'&&cfg.data_scope==='local'?'scope_asr_internal':'scope_'+cfg.data_scope);
    e.hidden=false;e.classList.toggle('ext',cfg.data_scope==='external'||cfg.asr_scope==='external');applyLang()}
  // 這場會議的資料（r32）：本機模式說明只幫助辨識；會送到公司外部時提醒
  {const ext=cfg.data_scope==='external'||cfg.asr_scope==='external';
   document.querySelectorAll('.notesExt').forEach(e=>{e.hidden=!ext});
   document.querySelectorAll('.notesLocal').forEach(e=>{e.hidden=ext||cfg.data_scope!=='local'})}
  if(cfg.minutes===false){$('langNote').dataset.tHtml='lang_note_local';$('fileNote').dataset.t='file_note_local';applyLang()}
  const live=await initLive();isLocal=!!live.local;
  // 第一次開啟（導覽會出來）或字幕正在進行：不跳「有新版本／顯示卡／模型」的視窗，下次打開再說（r29）
  const quiet=!store.get('pcg_tour_done')||!!live.running;
  if(isLocal){updCheck(false,quiet).then(()=>{if(!quiet)setTimeout(()=>gpuHint().then(()=>modelHint()),600)});$('updNowW').hidden=false;$('repW').hidden=false;$('updNow').onclick=e=>{e.preventDefault();updCheck(true)}}
  showTab(store.get('pcg_tab')||(live.local?'pLive':'pFile'));
  if(!store.get('pcg_tour_done'))setTimeout(tourStart,400);
  loadJobs();setInterval(()=>{if(!$('pFile').hidden&&!document.hidden)loadJobs()},4000);
})();
</script>
</body>
</html>
