<!DOCTYPE html>
<!-- PCG 集團版：給一般同仁用的簡易頁面。後端見 group/simple_routes.py。
     多國語言：所有文字在下方 I18N 對照表（zh 繁體中文、en、id 印尼文、vi 越南文、hi 印地語）；
     新增語言只要在 I18N 加一組、在 LANGS 加一列 -->
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PCG Meeting Translator</title>
<link rel="icon" href="/favicon.png">
<style>
:root{
  --bg:#f5f6f8;--card:#fff;--text:#1d2330;--dim:#5d6676;--line:#dde1e7;
  --accent:#1f6feb;--accent-ink:#fff;--accent-soft:#e7f0ff;
  --ok:#1a7f37;--ok-soft:#e6f4ea;--warn:#9a6700;--warn-soft:#fff4d6;--err:#cf222e;--err-soft:#ffebe9;
  --radius:14px;--shadow:0 1px 3px rgba(0,0,0,.06),0 4px 16px rgba(0,0,0,.04);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0f1218;--card:#171b23;--text:#e6e9ef;--dim:#98a1b2;--line:#2a303b;
  --accent:#4c8dff;--accent-ink:#0b0e13;--accent-soft:#1a2740;
  --ok:#4ac26b;--ok-soft:#14261b;--warn:#d4a72c;--warn-soft:#2a2310;--err:#ff6b6b;--err-soft:#2d1517;
  --shadow:none;
}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);
  font:16px/1.6 -apple-system,"Segoe UI","PingFang TC","Microsoft JhengHei","Noto Sans TC","Noto Sans Devanagari","Nirmala UI",sans-serif}
.wrap{max-width:860px;margin:0 auto;padding:24px 16px 64px}
header{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:20px}
header h1{font-size:22px;margin:0;font-weight:700}
header .sub{color:var(--dim);font-size:14px}
header .scope{margin-top:4px}header .scope.ext{color:var(--warn,#9a6700);font-weight:600}
.lang{flex:none;display:flex;align-items:center;gap:6px;color:var(--dim);font-size:14px}
.lang select{font:inherit;color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px 8px}
.tabs{display:flex;flex-wrap:wrap;gap:0 16px;margin-bottom:20px;border-bottom:1px solid var(--line)}
.tab{appearance:none;background:none;border:0;border-bottom:3px solid transparent;padding:10px 6px;
  font:inherit;font-size:17px;font-weight:600;color:var(--dim);cursor:pointer}
.tab[aria-selected=true]{color:var(--text);border-bottom-color:var(--accent)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;margin-bottom:16px}
.step{font-size:15px;font-weight:700;margin:0 0 12px;display:flex;align-items:center;gap:8px}
.step b{flex:none;display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.opt{position:relative;display:flex;gap:12px;align-items:center;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;cursor:pointer;background:var(--card)}
.opt input{position:absolute;opacity:0;pointer-events:none}
.opt:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.opt:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:2px}
.flag{flex:none;display:grid;place-items:center;width:40px;height:40px;border-radius:10px;background:var(--bg);font-weight:700;font-size:14px}
.opt .t{font-weight:600;line-height:1.3}
.opt .s{color:var(--dim);font-size:13px;line-height:1.3}
.drop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:130px;border:2px dashed var(--line);
  border-radius:12px;text-align:center;padding:16px;cursor:pointer;color:var(--dim)}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop .big{font-size:17px;color:var(--text);font-weight:600;word-break:break-all}
.drop.has .big{color:var(--accent)}
label.field{display:block;margin-top:14px;font-size:14px;color:var(--dim)}
input[type=text],input[type=number],input[type=password]{width:100%;margin-top:6px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;
  background:var(--bg);color:var(--text);font:inherit}
.row{display:flex;gap:12px;flex-wrap:wrap}
.row>label{flex:1 1 220px}
.check{display:flex;gap:10px;align-items:flex-start;margin-top:14px;cursor:pointer}
.check input{width:20px;height:20px;margin-top:3px;flex:none}
.check small{display:block;color:var(--dim);font-size:13px}
.btn{appearance:none;border:0;border-radius:12px;padding:14px 22px;font:inherit;font-weight:700;font-size:17px;cursor:pointer;
  background:var(--accent);color:var(--accent-ink);width:100%;margin-top:18px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:none;color:var(--accent);border:1.5px solid var(--accent);width:auto;font-size:15px;padding:8px 14px;margin:0}
.btn.small{width:auto;font-size:14px;padding:8px 14px;margin:0}
.note{font-size:14px;color:var(--dim);margin:8px 0 0}
.banner{border-radius:12px;padding:12px 14px;font-size:15px;margin-bottom:16px}
.banner.info{background:var(--accent-soft)}
.banner.warn{background:var(--warn-soft);color:var(--warn)}
.banner.err{background:var(--err-soft);color:var(--err)}
.banner.upd{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between}
.upd-actions{display:flex;gap:12px;align-items:center}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:12px;display:none}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
.jobs h2{font-size:18px;margin:28px 0 12px}
.job{display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:start}
.job .name{font-weight:600;word-break:break-all}
.job .meta{color:var(--dim);font-size:13px}
.chip{display:inline-block;border-radius:999px;padding:3px 10px;font-size:13px;font-weight:600}
.chip.queued{background:var(--bg);color:var(--dim)}
.chip.running{background:var(--accent-soft);color:var(--accent)}
.chip.done{background:var(--ok-soft);color:var(--ok)}
.chip.failed,.chip.cancelled{background:var(--err-soft);color:var(--err)}
.outs{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.outs a{display:inline-block;padding:8px 12px;border-radius:10px;border:1px solid var(--line);color:var(--text);text-decoration:none;font-size:14px}
.outs a.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.err-msg{grid-column:1/-1;color:var(--err);font-size:14px}
.err-msg small{display:block;color:var(--dim)}
.empty{color:var(--dim);text-align:center;padding:24px}
dialog{border:0;border-radius:var(--radius);padding:24px;background:var(--card);color:var(--text);width:min(380px,92vw)}
dialog::backdrop{background:rgba(0,0,0,.4)}
.hdr-right{flex:none;display:flex;align-items:center;gap:8px}
.foot{margin-top:28px;text-align:center;font-size:13px;color:var(--dim)}.foot a{color:var(--dim)}
.ver{color:var(--dim);font-size:12px;cursor:copy;user-select:all}
/* 導覽 */
.tour-spot{position:fixed;z-index:50;border-radius:12px;box-shadow:0 0 0 4px var(--accent),0 0 0 9999px rgba(0,0,0,.55);pointer-events:none;transition:all .25s}
.tour-tip{position:fixed;z-index:51;width:min(340px,calc(100vw - 32px));background:var(--card);color:var(--text);border-radius:14px;padding:16px;box-shadow:0 8px 30px rgba(0,0,0,.3)}
.tour-tip p{margin:0 0 12px;font-size:15px}
.tour-tip .n{color:var(--dim);font-size:13px}
.tour-tip .b{display:flex;gap:8px;align-items:center;justify-content:flex-end;flex-wrap:wrap}
.tour-tip .b .skip{margin-right:auto;background:none;border:0;color:var(--dim);font:inherit;font-size:14px;cursor:pointer;padding:6px}
[hidden]{display:none!important}
@media (max-width:520px){.grid{grid-template-columns:1fr 1fr}.opt{padding:10px;gap:8px}.flag{width:34px;height:34px}header{flex-direction:column}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1 data-t="title"></h1>
      <div class="sub" data-t="tagline"></div>
      <div class="sub scope" id="scope" hidden></div>
    </div>
    <div class="hdr-right">
      <button class="btn ghost small" id="tourBtn" type="button" data-t="tour_btn"></button>
      <label class="lang"><span aria-hidden="true">🌐</span>
        <select id="langSel" aria-label="Language"></select></label>
    </div>
  </header>

  <div id="updBox" class="banner info upd" hidden>
    <span id="updMsg"></span>
    <span class="upd-actions"><button class="btn small" id="updBtn" type="button"></button>
      <a id="updNotes" target="_blank" rel="noopener" hidden data-t="upd_notes"></a></span>
  </div>

  <div class="tabs" role="tablist">
    <button class="tab" role="tab" id="tabLive" aria-controls="pLive" aria-selected="false" data-t="tab_live"></button>
    <button class="tab" role="tab" id="tabFile" aria-controls="pFile" aria-selected="false" data-t="tab_file"></button>
  </div>

  <!-- 即時字幕 -->
  <section id="pLive" role="tabpanel" hidden>
    <div id="liveRemote" class="banner warn" hidden data-t-html="live_remote"></div>
    <div id="liveRunning" class="banner info" hidden>
      <span data-t="live_running"></span> <button class="btn ghost" id="openLive" type="button" data-t="open_live"></button>
    </div>
    <div id="liveForm">
      <div class="card">
        <p class="step"><b>1</b><span data-t="step_live_lang"></span></p>
        <div class="grid" id="liveScenarios"></div>
        <label class="check"><input type="checkbox" id="liveSpeak">
          <span><span data-t="speak_t"></span><small data-t="speak_s"></small></span></label>
        <label class="check"><input type="checkbox" id="liveRoom">
          <span><span data-t="room_t"></span><small data-t="room_s"></small></span></label>
        <label class="check"><input type="checkbox" id="liveOverlay">
          <span><span data-t="overlay_t"></span><small data-t="overlay_s"></small></span></label>
        <label class="field"><span data-t="topic_live"></span>
          <input type="text" id="liveTopic" maxlength="60" data-t-ph="topic_live_ph"></label>
        <button class="btn" id="liveStart" type="button" disabled data-t="start_live"></button>
        <p class="note" data-t="live_note"></p>
      </div>
    </div>
  </section>

  <!-- 錄音 → 會議紀錄 -->
  <section id="pFile" role="tabpanel" hidden>
    <form id="fileForm" class="card">
      <p class="step"><b>1</b><span data-t="step_file"></span></p>
      <div class="drop" id="drop" tabindex="0" role="button">
        <div class="big" id="dropText"></div>
        <div id="dropHint"></div>
      </div>
      <input type="file" id="fileInput" accept="audio/*,video/*,.m4a,.mp3,.wav,.mp4,.mkv,.webm,.flac,.ogg,.aac,.wma,.mov" hidden>

      <p class="step" style="margin-top:22px"><b>2</b><span data-t="step_lang"></span></p>
      <div class="grid" id="fileScenarios"></div>
      <p class="note" id="langNote" data-t-html="lang_note"></p>

      <div class="row">
        <label class="field"><span data-t="topic_file"></span>
          <input type="text" id="fileTopic" maxlength="60" data-t-ph="topic_file_ph"></label>
        <label class="field"><span data-t="speakers"></span>
          <input type="number" id="fileSpeakers" min="1" max="20" inputmode="numeric"></label>
      </div>
      <button class="btn" id="fileSubmit" type="submit" disabled data-t="submit"></button>
      <div class="bar" id="upBar"><i></i></div>
      <p class="note" id="fileNote" data-t="file_note"></p>
    </form>

    <div class="jobs">
      <h2 data-t="my_jobs"></h2>
      <div id="jobList"></div>
    </div>
  </section>
  <div class="foot"><a href="/simple/admin" data-t="it_link"></a> · <span id="ver" class="ver"></span></div>
</div>

<div class="tour-spot" id="tourSpot" hidden></div>
<div class="tour-tip" id="tourTip" role="dialog" aria-live="polite" hidden>
  <div class="n" id="tourN"></div><p id="tourText"></p>
  <div class="b"><button class="skip" id="tourSkip" type="button"></button>
    <button class="btn ghost small" id="tourPrev" type="button"></button><button class="btn small" id="tourNext" type="button"></button></div>
</div>

<dialog id="pwDlg">
  <form method="dialog" id="pwForm">
    <h3 style="margin-top:0" data-t="pw_title"></h3>
    <p class="note" style="margin-top:0" data-t="pw_hint"></p>
    <input type="password" id="pwInput" autocomplete="current-password" required>
    <p class="note" id="pwErr" style="color:var(--err)" hidden data-t="pw_wrong"></p>
    <button class="btn" type="submit" data-t="ok"></button>
  </form>
</dialog>

<script>
/* ── 多國語言 ─────────────────────────────────────────────── */
const LANGS=[['zh','繁體中文','zh-TW'],['en','English','en-US'],['id','Bahasa Indonesia','id-ID'],['vi','Tiếng Việt','vi-VN'],['hi','हिन्दी','hi-IN']];
const I18N={
zh:{
  upd_avail:'有新版本 v{v}（目前 v{c}）。更新約 1 分鐘，期間程式會暫時關閉。',upd_btn:'立即更新',upd_it_btn:'IT 更新',upd_it_pw:'請輸入 IT 密碼',upd_full:'有新版本 v{v}，這次要用完整安裝檔更新，請找 IT。',upd_notes:'更新內容',upd_running:'正在更新到 v{v}，約 1～2 分鐘，完成後這一頁會自動重新整理。請不要關閉電腦。',upd_failed:'更新沒有完成：{e}',upd_timeout:'更新似乎沒有完成。請重新整理頁面；還是舊版的話請找 IT。',upd_busy:'正在進行即時字幕或處理錄音，結束後再更新。',
  tour_btn:'導覽',tour_next:'下一步',tour_prev:'上一步',tour_skip:'略過',tour_done:'開始使用',tour_n:'第 {i} 步，共 {n} 步',it_link:'IT 設定',
  tr_lang:'先選你看得懂的語言，整個畫面會跟著換。',
  tr_tabs:'這裡有兩個功能：「即時字幕」在開會時看翻譯，「錄音 → 會議紀錄」把錄好的檔案轉成文字。',
  tr_live_lang:'開會前，先選「對方說什麼語言」。',
  tr_live_speak:'如果你也要說話（例如說中文給對方看翻譯），勾這個。記得戴耳機。',

  submit:'送出',uploading:'上傳中…',file_note:'送出後可以關掉這個頁面，回來時結果會在下方。一小時的會議大約要 10～30 分鐘。',

  st_queued:'排隊中',st_running:'處理中',st_done:'完成',st_failed:'失敗',st_cancelled:'已取消',

  cancel:'取消',confirm_cancel:'確定要取消這件工作？',job_id:'工作編號',
  pw_title:'請輸入同仁密碼',pw_hint:'密碼請向 IT 詢問。',pw_wrong:'密碼不正確',ok:'確定',

const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
function pickLang(){
  const saved=store.get('pcg_lang');if(saved&&I18N[saved])return saved;
  for(const l of navigator.languages||[navigator.language||'']){const c=(l||'').toLowerCase().split('-')[0];if(I18N[c])return c}
  return 'zh';
}
let lang=pickLang();
const t=(k,v={})=>String((I18N[lang]&&I18N[lang][k])??I18N.zh[k]??k).replace(/\{(\w+)\}/g,(_,x)=>v[x]??'');
const locale=()=>(LANGS.find(l=>l[0]===lang)||LANGS[0])[2];
function applyLang(){
  document.documentElement.lang=lang==='zh'?'zh-Hant':lang;
  document.title=t('title');
  document.querySelectorAll('[data-t]').forEach(el=>{el.textContent=t(el.dataset.t)});
  document.querySelectorAll('[data-t-html]').forEach(el=>{el.innerHTML=t(el.dataset.tHtml)});   // 只放對照表裡自己寫的 HTML
  document.querySelectorAll('[data-t-ph]').forEach(el=>{el.placeholder=t(el.dataset.tPh)});
  renderScenarios();setFile(file);renderJobs();
  if(!$('tourTip').hidden)tourShow();
}
const sel=$('langSel');
sel.innerHTML=LANGS.map(([c,n])=>`<option value="${c}">${n}</option>`).join('');
sel.value=lang;
sel.onchange=()=>{lang=sel.value;store.set('pcg_lang',lang);applyLang()};

/* ── 共用 ─────────────────────────────────────────────── */
let clientId=store.get('pcg_client');
if(!clientId||!/^[A-Za-z0-9_-]{8,64}$/.test(clientId)){clientId=Array.from(crypto.getRandomValues(new Uint8Array(12)),b=>b.toString(16).padStart(2,'0')).join('');store.set('pcg_client',clientId)}
let token=store.get('pcg_token')||'';
const hdr=()=>({'X-Client-Id':clientId,'X-Simple-Token':token});
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const errText=j=>j&&j.code&&I18N.zh['e_'+j.code]?t('e_'+j.code):(lang==='zh'&&j&&j.error?j.error:t('e_generic'));

async function api(path,opt={}){
  let r;
  try{r=await fetch(path,{...opt,headers:{...hdr(),...(opt.headers||{})}})}catch(e){return{ok:false,code:'network'}}
  const j=await r.json().catch(()=>({ok:false,code:'network'}));
  if(r.status===401&&j.need_password){await askPassword();return api(path,opt)}
  return j;
}
function askPassword(){
  return new Promise(res=>{
    const d=$('pwDlg');$('pwErr').hidden=!token;$('pwInput').value='';d.showModal();
    $('pwForm').onsubmit=()=>{token=$('pwInput').value;store.set('pcg_token',token);res()};
  });
}


/* ── 一鍵更新（小更新包）：有新版就在上方提示；按下去由這台電腦下載、比對指紋、安裝，完成後自動重新整理 ── */
let upd=null;
function updShow(kind,msg){const b=$('updBox');b.hidden=false;b.className='banner upd '+kind;$('updMsg').textContent=msg}
async function updCheck(){
  let j;try{j=await(await fetch('/api/simple/update')).json()}catch(e){return}
  if(!j.ok||!j.enabled||!j.available||!j.latest)return;
  upd=j;const v=j.latest.version;
  const n=$('updNotes');n.hidden=!j.latest.notes_url;if(j.latest.notes_url)n.href=j.latest.notes_url;
  if(j.latest.kind!=='patch'){updShow('info',t('upd_full',{v}));$('updBtn').hidden=true;return}
  updShow('info',t('upd_avail',{v,c:j.current}));
  const b=$('updBtn');b.hidden=false;b.textContent=t(j.who==='it'?'upd_it_btn':'upd_btn');b.onclick=updRun;
}
async function updRun(){
  const v=upd.latest.version,h={'Content-Type':'application/json'};
  if(upd.who==='it'){const p=prompt(t('upd_it_pw'));if(!p)return;h['X-IT-Token']=p}
  const b=$('updBtn');b.disabled=true;
  let j;try{j=await(await fetch('/api/simple/update',{method:'POST',headers:h,body:'{}'})).json()}catch(e){j={ok:false,error:'network'}}
  if(!j.ok){b.disabled=false;updShow('warn',j.code==='update_busy'?t('upd_busy'):t('upd_failed',{e:j.error||j.code||''}));return}
  b.hidden=true;$('updNotes').hidden=true;updShow('warn',t('upd_running',{v}));
  // 小更新包會關掉程式、換檔、自我檢查、重新開啟：等到伺服器回來而且版本變了就重新整理
  const end=Date.now()+4*60*1000;
  const tick=async()=>{
    try{const c=await(await fetch('/api/simple/update')).json();if(c.ok&&c.current===v){location.reload();return}}catch(e){}
    if(Date.now()>end){updShow('err',t('upd_timeout'));return}
    setTimeout(tick,3000);
  };
  setTimeout(tick,8000);
}

/* ── 分頁 ─────────────────────────────────────────────── */
function showTab(which){
  for(const [tb,p] of [['tabLive','pLive'],['tabFile','pFile']]){const on=p===which;$(tb).setAttribute('aria-selected',on);$(p).hidden=!on}
  store.set('pcg_tab',which);
}
$('tabLive').onclick=()=>showTab('pLive');$('tabFile').onclick=()=>showTab('pFile');

/* 情境卡片：標題依語言翻譯（IT 自訂、對照表沒有的情境沿用伺服器給的名稱） */
let liveScen=[],fileScen=[];
const liveTitle=s=>I18N.zh['lv_'+s.id]?t('lv_'+s.id):s.title;
const fileTitle=s=>I18N.zh['fs_'+s.id]?t('fs_'+s.id):s.title;
const fileSub=s=>I18N.zh['fs_'+s.id]?(I18N.zh['fs_sub_'+s.id]?t('fs_sub_'+s.id):t('fs_sub')):(s.subtitle||'');
function cardsHtml(list,name,title,sub){
  const cur=document.querySelector(`input[name=${name}]:checked`)?.value;
  return list.map(s=>`<label class="opt"><input type="radio" name="${name}" value="${esc(s.id)}"${s.id===cur?' checked':''}>
    <span class="flag">${esc(s.flag)}</span><span><span class="t">${esc(title(s))}</span>${sub&&sub(s)?`<br><span class="s">${esc(sub(s))}</span>`:''}</span></label>`).join('');
}
function renderScenarios(){
  $('liveScenarios').innerHTML=cardsHtml(liveScen,'live',liveTitle);
  $('fileScenarios').innerHTML=cardsHtml(fileScen,'file',fileTitle,fileSub);
}
const picked=name=>document.querySelector(`input[name=${name}]:checked`)?.value;

/* ── 即時字幕 ─────────────────────────────────────────── */
function onLivePick(){
  const s=liveScen.find(x=>x.id===picked('live'));
  $('liveSpeak').disabled=!s?.can_bidi;if(!s?.can_bidi)$('liveSpeak').checked=false;
  $('liveRoom').disabled=!s?.can_room;if(!s?.can_room)$('liveRoom').checked=false;
  $('liveStart').disabled=!s;if(s)store.set('pcg_live',s.id);
}
$('liveScenarios').addEventListener('change',onLivePick);
// 「我也要說話」（耳機＋麥克風分流）與「教室模式」（同一支麥克風自動判斷）二選一
$('liveSpeak').addEventListener('change',()=>{if($('liveSpeak').checked)$('liveRoom').checked=false});
$('liveRoom').addEventListener('change',()=>{if($('liveRoom').checked)$('liveSpeak').checked=false});
async function initLive(){
  const j=await api('/api/simple/live');
  liveScen=j.scenarios||[];renderScenarios();
  const last=store.get('pcg_live');const el=last&&document.querySelector(`input[name=live][value="${CSS.escape(last)}"]`);
  if(el)el.checked=true;onLivePick();
  $('liveRemote').hidden=!!j.local;$('liveForm').hidden=!j.local;$('liveRunning').hidden=!j.running;
  return j;
}
$('openLive').onclick=()=>{location.href='/simple/live'};
$('liveStart').onclick=async()=>{
  const b=$('liveStart');b.disabled=true;b.textContent=t('preparing');
  const j=await api('/api/simple/live',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({scenario:picked('live'),speak:$('liveSpeak').checked,room:$('liveRoom').checked,overlay:$('liveOverlay').checked,topic:$('liveTopic').value})});
  if(j.ok){location.href='/simple/live';return}
  alert(errText(j));b.disabled=false;b.textContent=t('start_live');
};

/* ── 錄音 → 會議紀錄 ──────────────────────────────────── */
let file=null;
function setFile(f){
  file=f||null;
  $('drop').classList.toggle('has',!!file);
  $('drop').setAttribute('aria-label',t('step_file'));
  $('dropText').textContent=file?file.name:t('drop_big');
  $('dropHint').textContent=file?t('drop_has',{size:(file.size/1048576).toFixed(1)}):t('drop_hint');
  updSubmit();
}
function updSubmit(){$('fileSubmit').disabled=!(file&&picked('file'))}
$('fileScenarios').addEventListener('change',updSubmit);
const drop=$('drop');
drop.onclick=()=>$('fileInput').click();
drop.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();$('fileInput').click()}};
$('fileInput').onchange=e=>setFile(e.target.files[0]);
drop.ondragover=e=>{e.preventDefault();drop.classList.add('over')};
drop.ondragleave=()=>drop.classList.remove('over');
drop.ondrop=e=>{e.preventDefault();drop.classList.remove('over');setFile(e.dataTransfer.files[0])};

$('fileForm').onsubmit=e=>{
  e.preventDefault();if(!file||!picked('file'))return;
  const fd=new FormData();fd.append('file',file);fd.append('scenario',picked('file'));
  fd.append('topic',$('fileTopic').value);fd.append('speakers',$('fileSpeakers').value);
  const x=new XMLHttpRequest();x.open('POST','/api/simple/jobs');
  for(const [k,v] of Object.entries(hdr()))x.setRequestHeader(k,v);
  const bar=$('upBar'),btn=$('fileSubmit');bar.style.display='block';btn.disabled=true;btn.textContent=t('uploading');
  const done=()=>{bar.style.display='none';bar.firstElementChild.style.width='0';btn.textContent=t('submit')};
  x.upload.onprogress=ev=>{if(ev.lengthComputable)bar.firstElementChild.style.width=(ev.loaded/ev.total*100)+'%'};
  x.onload=async()=>{
    done();let j={};try{j=JSON.parse(x.responseText)}catch(err){}
    if(x.status===401&&j.need_password){await askPassword();$('fileForm').requestSubmit();return}
    if(!j.ok){alert(errText(j));updSubmit();return}
    setFile(null);$('fileInput').value='';$('fileTopic').value='';$('fileSpeakers').value='';
    loadJobs();
  };
  x.onerror=()=>{done();updSubmit();alert(t('e_network'))};
  x.send(fd);
};

let jobs=[];const keys={};
const fmtTime=s=>s?new Date(s*1000).toLocaleString(locale(),{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}):'';
function jobTitle(job){
  const s=fileScen.find(x=>x.id===job.scenario);
  return s&&I18N.zh['fs_'+s.id]?t('mtg',{lang:fileTitle(s)}):job.scenario_title;
}
async function loadJobs(){
  const j=await api('/api/simple/jobs');if(!j.ok)return;
  jobs=j.jobs||[];
  for(const job of jobs)if(job.state==='done'&&!keys[job.id]){const k=await api(`/api/simple/jobs/${job.id}/link`);if(k.ok)keys[job.id]=k.key}
  renderJobs();
}
function renderJobs(){
  if(!jobs.length){$('jobList').innerHTML=`<div class="empty">${esc(t('no_jobs'))}</div>`;return}
  $('jobList').innerHTML=jobs.map(job=>{
    let st=t('st_'+job.state),extra='';
    if(job.state==='queued'&&job.ahead)st+=t('ahead',{n:job.ahead});
    if(job.state==='running'){const m=Math.max(1,Math.round((Date.now()/1000-job.started)/60));st=`${job.stage?t('sg_'+job.stage):t('st_running')} · ${t('minutes',{n:m})}`}
    if(job.state==='done')extra=`<div class="outs">${(job.outputs||[]).map(o=>
      `<a class="${esc(o.style)}" target="_blank" rel="noopener" href="/simple/files/${encodeURIComponent(job.id)}/${encodeURIComponent(o.name)}?k=${encodeURIComponent(keys[job.id]||'')}">${esc(I18N.zh['o_'+o.kind]?t('o_'+o.kind):o.label)}</a>`).join('')}</div>`;
    if(job.state==='failed'){
      const msg=job.error_code&&I18N.zh['e_'+job.error_code]?t('e_'+job.error_code):t('e_failed');
      const detail=job.error_code==='detail'&&job.error?`<small>${esc(job.error)}</small>`:'';
      extra=`<div class="err-msg">${esc(msg)}（${esc(t('job_id'))} ${esc(job.id)}）${detail}</div>`;
    }
    const cancel=(job.state==='queued'||job.state==='running')?`<button class="btn ghost small" data-cancel="${esc(job.id)}" type="button">${esc(t('cancel'))}</button>`:'';
    return `<div class="card job"><div><div class="name">${esc(job.file)}</div>
      <div class="meta">${esc(jobTitle(job))}${job.topic?' · '+esc(job.topic):''} · ${esc(fmtTime(job.created))}</div></div>
      <div style="text-align:right"><span class="chip ${esc(job.state)}">${esc(st)}</span>${cancel?'<div style="margin-top:6px">'+cancel+'</div>':''}</div>${extra}</div>`;
  }).join('');
}
$('jobList').onclick=async e=>{
  const id=e.target.dataset?.cancel;if(!id)return;
  if(!confirm(t('confirm_cancel')))return;
  await api(`/api/simple/jobs/${encodeURIComponent(id)}/cancel`,{method:'POST'});loadJobs();
};

/* ── 導覽（第一次打開自動開始；右上角「導覽」可再看）──────────── */
const TOUR=[
  {el:'langSel',key:'tr_lang'},
  {el:'.tabs',key:'tr_tabs'},
  {el:'liveScenarios',key:'tr_live_lang',tab:'pLive',needLocal:true},
  {el:'liveSpeak',key:'tr_live_speak',tab:'pLive',needLocal:true,box:'label'},
  {el:'liveStart',key:'tr_live_start',tab:'pLive',needLocal:true},
  {el:'drop',key:'tr_file_drop',tab:'pFile'},
  {el:'fileScenarios',key:'tr_file_lang',tab:'pFile'},
  {el:'fileSubmit',key:'tr_file_submit',tab:'pFile'},
  {el:'jobList',key:'tr_jobs',tab:'pFile'}];
let tourSteps=[],tourI=0,tourTabBefore=null,isLocal=false;
const tourEl=st=>{let e=st.el.startsWith('.')?document.querySelector(st.el):$(st.el);if(e&&st.box)e=e.closest(st.box)||e;return e};
function tourStart(){
  tourSteps=TOUR.filter(st=>!st.needLocal||isLocal);tourI=0;
  tourTabBefore=$('pFile').hidden?'pLive':'pFile';
  $('tourSpot').hidden=$('tourTip').hidden=false;tourShow();
}
function tourEnd(){
  $('tourSpot').hidden=$('tourTip').hidden=true;store.set('pcg_tour_done','1');
  if(tourTabBefore)showTab(tourTabBefore);
}
function tourShow(){
  const st=tourSteps[tourI];if(!st)return tourEnd();
  if(st.tab)showTab(st.tab);
  const e=tourEl(st);if(!e){tourI++;return tourShow()}
  e.scrollIntoView({block:'center',behavior:'instant'});
  requestAnimationFrame(()=>{
    const r=e.getBoundingClientRect(),pad=6,spot=$('tourSpot'),tip=$('tourTip');
    Object.assign(spot.style,{left:(r.left-pad)+'px',top:(r.top-pad)+'px',width:(r.width+pad*2)+'px',height:(r.height+pad*2)+'px'});
    $('tourN').textContent=t('tour_n',{i:tourI+1,n:tourSteps.length});$('tourText').textContent=t(st.key);
    $('tourSkip').textContent=t('tour_skip');$('tourPrev').textContent=t('tour_prev');$('tourPrev').hidden=tourI===0;
    $('tourNext').textContent=t(tourI===tourSteps.length-1?'tour_done':'tour_next');
    const th=tip.offsetHeight,below=r.bottom+pad+12,vw=innerWidth;
    tip.style.top=(below+th<innerHeight?below:Math.max(12,r.top-pad-12-th))+'px';
    tip.style.left=Math.min(Math.max(16,r.left),vw-tip.offsetWidth-16)+'px';
    $('tourNext').focus();
  });
}
$('tourNext').onclick=()=>{tourI++;tourShow()};
$('tourPrev').onclick=()=>{tourI=Math.max(0,tourI-1);tourShow()};
$('tourSkip').onclick=tourEnd;
$('tourBtn').onclick=tourStart;
addEventListener('keydown',e=>{if($('tourTip').hidden)return;if(e.key==='Escape')tourEnd();if(e.key==='ArrowRight')$('tourNext').click();if(e.key==='ArrowLeft'&&tourI>0)$('tourPrev').click()});
addEventListener('resize',()=>{if(!$('tourTip').hidden)tourShow()});

function showVer(v){const e=document.getElementById('ver');if(!e||!v)return;
  const full=`PCG v${v.version}${v.commit?' ('+v.commit+')':''}${v.upstream?' · jt-live-whisper v'+v.upstream:''}`;
  e.textContent='v'+v.version+(v.version==='dev'&&v.commit?' ('+v.commit+')':'');e.title=full;
  e.onclick=()=>{try{navigator.clipboard.writeText(full)}catch(x){}}}
(async()=>{
  applyLang();
  const cfg=await api('/api/simple/config');
  if(!cfg.ok){$('jobList').innerHTML=`<div class="banner err">${esc(errText(cfg))}</div>`;return}
  fileScen=cfg.scenarios||[];showVer(cfg.version);
  // 資料送到哪裡：照 IT 的設定顯示（本機／內部伺服器／集團 AI 平台／外部 AI 服務），不寫死成一定不外送
  if(cfg.data_scope){const e=$('scope');e.dataset.t='scope_'+cfg.data_scope;e.hidden=false;e.classList.toggle('ext',cfg.data_scope==='external');applyLang()}
  if(cfg.minutes===false){$('langNote').dataset.tHtml='lang_note_local';$('fileNote').dataset.t='file_note_local';applyLang()}
  const live=await initLive();isLocal=!!live.local;
  if(isLocal)updCheck();
  showTab(store.get('pcg_tab')||(live.local?'pLive':'pFile'));
  if(!store.get('pcg_tour_done'))setTimeout(tourStart,400);
  loadJobs();setInterval(()=>{if(!$('pFile').hidden&&!document.hidden)loadJobs()},4000);
})();
</script>
</body>
