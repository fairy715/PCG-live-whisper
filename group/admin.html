<!DOCTYPE html>
<!-- PCG 集團版：IT 設定頁（/simple/admin）。後端見 group/simple_routes.py 的 admin_*。
     介面語言：繁體中文、English、Bahasa Indonesia（給 IT；同仁用的簡易頁面另有五種語言） -->
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PCG IT Settings</title>
<link rel="icon" href="/favicon.png">
<style>
:root{--bg:#f5f6f8;--card:#fff;--text:#1d2330;--dim:#5d6676;--line:#dde1e7;--accent:#1f6feb;--accent-ink:#fff;--accent-soft:#e7f0ff;
  --ok:#1a7f37;--ok-soft:#e6f4ea;--err:#cf222e;--err-soft:#ffebe9;--warn:#9a6700;--warn-soft:#fff4d6;--radius:14px}
@media (prefers-color-scheme:dark){:root{--bg:#0f1218;--card:#171b23;--text:#e6e9ef;--dim:#98a1b2;--line:#2a303b;--accent:#4c8dff;--accent-ink:#0b0e13;
  --accent-soft:#1a2740;--ok:#4ac26b;--ok-soft:#14261b;--err:#ff6b6b;--err-soft:#2d1517;--warn:#d4a72c;--warn-soft:#2a2310}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.6 -apple-system,"Segoe UI","PingFang TC","Microsoft JhengHei","Noto Sans TC",sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:24px 16px 64px}
header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:16px}
h1{font-size:22px;margin:0}
.sub{color:var(--dim);font-size:14px}
.ver{color:var(--dim);font-size:12px;cursor:copy;user-select:all}
select,input[type=text],input[type=password],input[type=number]{font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 11px;width:100%}
header select{width:auto;background:var(--card);padding:6px 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px;margin-bottom:16px}
.card h2{font-size:17px;margin:0 0 12px}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mode{display:block;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer}
.mode:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.mode input{margin-right:6px}
.mode b{font-size:16px}
.mode small{display:block;color:var(--dim);margin-top:4px;font-size:13px;line-height:1.4}
.row{display:grid;grid-template-columns:1fr 120px;gap:10px}
label.f{display:block;margin-top:12px;font-size:14px;color:var(--dim)}
label.f>input,label.f>select{margin-top:4px}
.check{display:flex;gap:8px;align-items:center;margin-top:14px;cursor:pointer}
.check input{width:18px;height:18px}
.btn{appearance:none;border:0;border-radius:12px;padding:12px 20px;font:inherit;font-weight:700;cursor:pointer;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:none;color:var(--accent);border:1.5px solid var(--accent);padding:9px 16px;font-weight:600}
.btn:disabled{opacity:.45;cursor:not-allowed}
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:16px}
.res{font-size:14px;margin-top:10px;padding:10px 12px;border-radius:10px}
.res.ok{background:var(--ok-soft);color:var(--ok)}.res.err{background:var(--err-soft);color:var(--err)}.res.warn{background:var(--warn-soft);color:var(--warn)}
.note{font-size:13px;color:var(--dim);margin:6px 0 0}
h3.sub{font-size:14px;margin:18px 0 6px;color:var(--dim);font-weight:600}h3.sub:first-of-type{margin-top:4px}
.presets{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 4px}
.chip{border:1px solid var(--accent);background:none;color:var(--accent);border-radius:999px;padding:5px 12px;font:inherit;font-size:13px;cursor:pointer}
.chip:hover{background:var(--accent-soft)}
.mrow{display:flex;gap:10px;align-items:center;justify-content:space-between;border-top:1px solid var(--line);padding:10px 0;font-size:14px}
.mrow:first-child{border-top:0}.mrow b{font-weight:600}.mrow small{display:block;color:var(--dim);font-size:12.5px}
.mrow .btn.ghost{padding:6px 12px;font-size:13px;white-space:nowrap}
.muse{display:grid;grid-template-columns:7em 1fr 1fr;gap:8px 10px;align-items:center;font-size:14px}
.muse .h{color:var(--dim);font-size:13px}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--accent)}
[hidden]{display:none!important}
@media (max-width:560px){.modes{grid-template-columns:1fr}.row{grid-template-columns:1fr 90px}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div><h1 data-t="title"></h1><div class="sub" data-t="tagline"></div><span id="ver" class="ver"></span></div>
    <select id="langSel" aria-label="Language"><option value="zh">繁體中文</option><option value="en">English</option><option value="id">Bahasa Indonesia</option></select>
  </header>

  <!-- 登入／第一次設定密碼 -->
  <section id="pLogin" class="card" hidden>
    <h2 id="loginTitle"></h2>
    <p class="note" id="loginNote"></p>
    <label class="f"><span data-t="it_password"></span><input type="password" id="pw1" autocomplete="current-password"></label>
    <label class="f" id="pw2Wrap" hidden><span data-t="it_password_again"></span><input type="password" id="pw2" autocomplete="new-password"></label>
    <div class="actions"><button class="btn" id="loginBtn" type="button"></button></div>
    <div id="loginRes" class="res err" hidden></div>
  </section>

  <form id="pMain" hidden>
    <div class="card">
      <h2 data-t="mode_title"></h2>
      <div class="modes">
        <label class="mode"><input type="radio" name="backend" value="local"><b data-t="mode_local"></b><small data-t="mode_local_s"></small></label>
        <label class="mode"><input type="radio" name="backend" value="server"><b data-t="mode_server"></b><small data-t="mode_server_s"></small></label>
      </div>
      <div id="m2mWarn" class="res warn" hidden data-t="m2m_missing"></div>
    </div>

    <div class="card" id="cServer">
      <h2 data-t="servers_title"></h2>
      <h3 class="sub" data-t="llm_section"></h3>
      <label class="f"><span data-t="llm_style"></span>
        <select id="llmStyle"><option value="openwebui" data-t="style_owui"></option><option value="auto" data-t="style_auto"></option><option value="openai" data-t="style_ext"></option></select></label>
      <div id="extWarn" class="res warn" hidden data-t="ext_warn"></div>
      <div class="presets" id="presets" hidden>
        <button type="button" class="chip" data-u="https://api.openai.com/v1">OpenAI</button>
        <button type="button" class="chip" data-u="https://api.deepseek.com/v1">DeepSeek</button>
        <button type="button" class="chip" data-u="https://generativelanguage.googleapis.com/v1beta/openai">Google Gemini</button>
        <button type="button" class="chip" data-u="https://openrouter.ai/api/v1">OpenRouter</button>
      </div>
      <label class="f"><span data-t="llm_url"></span><input type="text" id="llmUrl" placeholder="https://ai.example.com"></label>
      <p class="note" id="llmUrlNote"></p>
      <label class="f"><span id="llmKeyLabel"></span><input type="password" id="llmKey" autocomplete="off" data-t-ph="llm_key_ph"></label>
      <label class="check" id="clearKeyWrap" hidden><input type="checkbox" id="clearKey"><span data-t="clear_llm_key"></span></label>
      <p class="note" id="llmKeyNote"></p>
      <h3 class="sub" data-t="gpu_section"></h3>
      <div class="row">
        <label class="f"><span data-t="gpu_host"></span><input type="text" id="gpuHost" placeholder="192.168.1.50" data-t-ph="gpu_ph"></label>
        <label class="f"><span data-t="port"></span><input type="number" id="gpuPort" min="1" max="65535"></label>
      </div>
      <p class="note" data-t="gpu_note"></p>
      <div class="actions"><button class="btn ghost" id="testBtn" type="button" data-t="test"></button></div>
      <div id="testRes"></div>
      <label class="f"><span data-t="llm_model"></span><input type="text" id="llmModel" list="modelList" placeholder="luna"></label>
      <label class="f"><span data-t="summary_model"></span><input type="text" id="sumModel" list="modelList" data-t-ph="default_ph"></label>
      <datalist id="modelList"></datalist>
      <p class="note" data-t="model_note"></p>
      <label class="f" id="asrWrap"><span data-t="asr_model"></span>
        <select id="asrModel"><option>large-v3-turbo</option><option>large-v3</option><option>medium</option></select></label>
    </div>

    <div class="card" id="cLocal">
      <h2 data-t="local_title"></h2>
      <div class="row" style="grid-template-columns:1fr 1fr">
        <label class="f"><span data-t="live_model"></span>
          <select id="liveModel"></select></label>
        <label class="f"><span data-t="file_model"></span>
          <select id="fileModel"></select></label>
      </div>
      <p class="note" data-t="local_models_note"></p>
    </div>

    <div class="card">
      <h2 data-t="other_title"></h2>
      <label class="check"><input type="checkbox" id="diarize"><span data-t="diarize"></span></label>
      <p class="note" data-t="diarize_note"></p>
      <label class="check"><input type="checkbox" id="remoteView"><span data-t="remote_view"></span></label>
      <p class="note" data-t="remote_view_note"></p>
      <label class="check"><input type="checkbox" id="multiLang"><span data-t="multi_lang"></span></label>
      <p class="note" data-t="multi_lang_note"></p>
      <label class="f"><span id="staffPwLabel"></span><input type="password" id="staffPw" autocomplete="new-password" data-t-ph="staff_pw_ph"></label>
      <label class="check" id="clearStaffWrap" hidden><input type="checkbox" id="clearStaff"><span data-t="clear_staff_pw"></span></label>
    </div>

    <div class="card">
      <h2 data-t="upd_title"></h2>
      <label class="check"><input type="checkbox" id="updCheck"><span data-t="upd_check"></span></label>
      <label class="f"><span data-t="upd_who"></span>
        <select id="updWho"><option value="staff" data-t="upd_who_staff"></option><option value="it" data-t="upd_who_it"></option></select></label>
      <label class="f"><span data-t="upd_share"></span><input type="text" id="updShare" data-t-ph="upd_share_ph"></label>
      <p class="note" data-t="upd_note"></p>
    </div>

    <div class="card" id="cReport">
      <h2 data-t="sup_title"></h2>
      <label class="f"><span data-t="sup_contact"></span><input type="text" id="supContact" maxlength="200" data-t-ph="sup_contact_ph"></label>
      <p class="note" data-t="sup_note"></p>
      <div style="margin-top:12px"><button class="btn ghost" type="button" id="supMake" data-t="sup_make"></button></div>
      <div id="supRes" hidden></div>
    </div>

    <div class="card" id="cModels">
      <h2 data-t="models_title"></h2>
      <p class="note" data-t="models_note"></p>
      <h3 class="sub" data-t="models_use"></h3>
      <div class="muse" id="mUse"></div>
      <div style="margin-top:12px"><button class="btn ghost" type="button" id="mApply" data-t="models_apply"></button></div>
      <div id="mUseRes" hidden></div>
      <h3 class="sub" data-t="models_installed"></h3>
      <div id="mInst"></div>
      <h3 class="sub" data-t="models_available"></h3>
      <div id="mAvail"></div>
      <p class="note" id="mErr" hidden></p>
      <div style="margin-top:8px"><button class="chip" type="button" id="mRefresh" data-t="models_refresh"></button></div>
      <p class="note" data-t="models_offline"></p>
    </div>

    <div class="actions">
      <button class="btn" type="submit" data-t="save"></button>
      <a href="/simple" data-t="back"></a>
      <button class="btn ghost" id="chgPwBtn" type="button" data-t="change_it_pw" style="margin-left:auto"></button>
    </div>
    <div id="saveRes" hidden></div>
    <div class="res warn" id="rsBox" hidden><span id="rsMsg"></span>
      <div class="actions"><button class="btn" id="rsBtn" type="button" data-t="rs_btn"></button></div></div>
  </form>
</div>

<script>

const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
let lang=({zh:'zh',id:'id'})[store.get('pcg_lang')||'zh']||'en';   // 跟同仁頁面共用語言設定；越南文、印地語的 IT 用英文
const t=(k,v={})=>String(I18N[lang][k]??I18N.zh[k]??k).replace(/\{(\w+)\}/g,(_,x)=>v[x]??'');
let token=sessionStorage.getItem('pcg_it')||'',state=null,firstTime=false;
function applyLang(){
  document.documentElement.lang=lang==='zh'?'zh-Hant':lang;document.title=t('title');
  document.querySelectorAll('[data-t]').forEach(e=>{e.textContent=t(e.dataset.t)});
  document.querySelectorAll('[data-t-ph]').forEach(e=>{e.placeholder=t(e.dataset.tPh)});
  $('loginTitle').textContent=t(firstTime?'set_pw_title':'login_title');$('loginNote').textContent=t(firstTime?'set_pw_note':'login_note');
  $('loginBtn').textContent=t(firstTime?'set_pw_btn':'login');
  $('staffPwLabel').textContent=t(state&&state.staff_password_set?'staff_pw_set':'staff_pw');
  styleVis();
}
$('langSel').value=lang;$('langSel').onchange=()=>{lang=$('langSel').value;applyLang();if(typeof renderModels==='function')renderModels();if(state&&!$('rsBtn').disabled)rsShow()};
async function api(path,body){
  const r=await fetch(path,{method:body?'POST':'GET',headers:{'Content-Type':'application/json','X-IT-Token':token},body:body?JSON.stringify(body):undefined});
  return r.json().catch(()=>({ok:false}));
}
const errMsg=j=>j&&j.code&&I18N.zh[j.code]?t(j.code):(j&&j.code==='it_password_wrong'?t('pw_wrong'):t('error'));

// 程式自己重新啟動（r20）：「允許其他電腦或手機連進來看字幕」改了以後，按一下就生效，不用去關 python.exe
function rsShow(){
  const need=state&&!!state.allow_remote_view!==!!state.remote_bound;
  $('rsBox').hidden=!need;if(!need)return;
  $('rsMsg').textContent=state.can_restart?t(state.allow_remote_view?'rs_on':'rs_off'):t('rs_manual');
  $('rsBtn').hidden=!state.can_restart;$('rsBtn').disabled=false;
}
$('rsBtn').onclick=async()=>{
  const b=$('rsBtn');b.disabled=true;$('rsMsg').textContent=t('rs_wait');
  const j=await api('/api/simple/restart',{stop_live:true});
  if(!j.ok){$('rsMsg').textContent=j.code==='restart_busy_file'?t('restart_busy_file'):(j.error||t('rs_fail'));b.disabled=false;return}
  const want=!!state.allow_remote_view;
  for(let i=0;i<60;i++){
    await new Promise(r=>setTimeout(r,1000));
    try{const s=await (await fetch('/api/simple/share',{cache:'no-store'})).json();
      if(s.ok&&!!s.bound===want){location.reload();return}}catch(e){}
  }
  $('rsMsg').textContent=t('rs_fail');
};

async function load(){
  const j=await api('/api/simple/admin/state');
  if(j.ok){state=j.state;showMain();rsShow();return}
  firstTime=j.code==='it_password_unset';
  $('pLogin').hidden=false;$('pMain').hidden=true;$('pw2Wrap').hidden=!firstTime;
  if(firstTime&&!j.can_set){$('loginRes').hidden=false;$('loginRes').textContent=t('local_only');$('loginBtn').disabled=true}
  applyLang();
}
$('loginBtn').onclick=async()=>{
  const p=$('pw1').value,res=$('loginRes');res.hidden=true;
  if(firstTime){
    if(p!==$('pw2').value){res.hidden=false;res.textContent=t('pw_mismatch');return}
    const j=await api('/api/simple/admin/password',{new:p});
    if(!j.ok){res.hidden=false;res.textContent=errMsg(j);return}
  }
  token=p;sessionStorage.setItem('pcg_it',token);
  const j=await api('/api/simple/admin/state');
  if(!j.ok){res.hidden=false;res.textContent=t('pw_wrong');return}
  state=j.state;showMain();
};
$('pw1').onkeydown=e=>{if(e.key==='Enter')$('loginBtn').click()};

function showVer(v){const e=document.getElementById('ver');if(!e||!v)return;
  const full=`PCG v${v.version}${v.commit?' ('+v.commit+')':''}${v.upstream?' · jt-live-whisper v'+v.upstream:''}`;
  e.textContent='v'+v.version+(v.version==='dev'&&v.commit?' ('+v.commit+')':'');e.title=full;
  e.onclick=()=>{try{navigator.clipboard.writeText(full)}catch(x){}}}
function showMain(){
  $('pLogin').hidden=true;$('pMain').hidden=false;showVer(state.version);
  document.querySelector(`input[name=backend][value=${state.backend}]`).checked=true;
  $('gpuHost').value=state.gpu_host||'';$('gpuPort').value=state.gpu_port||8978;
  $('llmUrl').value=state.llm_url||'';$('llmStyle').value=state.llm_url?(state.llm_api_style||'auto'):'openwebui';
  $('llmKey').value='';$('clearKey').checked=false;$('clearKeyWrap').hidden=!state.llm_api_key_set;
  $('llmModel').value=state.llm_model||'';$('sumModel').value=state.summary_model||'';
  $('asrModel').value=state.asr_model||'large-v3-turbo';
  fillLocalModels();
  $('updCheck').checked=state.update_check!==false;$('updWho').value=state.update_who||'staff';$('updShare').value=state.update_share||'';$('supContact').value=state.support_contact||'';
  $('diarize').checked=!!state.diarize;$('remoteView').checked=!!state.allow_remote_view;$('multiLang').checked=state.multi_lang!==false;$('clearStaffWrap').hidden=!state.staff_password_set;
  modeVis();applyLang();loadModels();
}
/* 本機辨識模型：內建 small＋裝好的多語模型包（離線安裝的電腦不會自己下載模型，所以只列出這台有的） */
function fillLocalModels(){
  const packs=((models&&models.installed)||[]).filter(p=>p.type==='asr'&&p.multilingual);
  for(const [id,cur] of [['liveModel',state.local_live_model||'small'],['fileModel',state.local_file_model||'small']]){
    const opts=[['small',t('m_small_builtin')]].concat(packs.map(p=>['pack:'+p.id,p.name||p.id]));
    if(!opts.some(o=>o[0]===cur))opts.push([cur,t('m_missing',{n:cur})]);
    $(id).innerHTML=opts.map(([v,n])=>`<option value="${escH(v)}">${escH(n)}</option>`).join('');$(id).value=cur;
  }
}
function styleVis(){
  const st=$('llmStyle').value,k={openwebui:'owui',auto:'auto',openai:'ext'}[st]||'auto';
  $('llmUrlNote').textContent=t('url_'+k);$('llmKeyNote').textContent=t('key_'+k);
  $('extWarn').hidden=$('presets').hidden=st!=='openai';
  $('llmUrl').placeholder={openwebui:'https://ai.example.com',auto:'192.168.1.60:11434',openai:'https://api.openai.com/v1'}[st];
  $('llmModel').placeholder={openwebui:'luna',auto:'gemma4:26b',openai:''}[st];
  $('llmKeyLabel').textContent=t(state&&state.llm_api_key_set?'llm_key_set':'llm_key')+(st==='auto'?({zh:'（選填）',id:' (opsional)'}[lang]||' (optional)'):'');
}
$('llmStyle').onchange=()=>{styleVis();$('modelList').innerHTML=''};
document.querySelectorAll('#presets .chip').forEach(b=>b.onclick=()=>{$('llmUrl').value=b.dataset.u;$('llmModel').value='';$('sumModel').value=''});
function modeVis(){
  const server=document.querySelector('input[name=backend]:checked')?.value==='server';
  const gpu=!!$('gpuHost').value.trim();
  // 伺服器模式但沒有 GPU 伺服器：辨識在本機，本機辨識模型要看得到
  $('cLocal').hidden=server&&gpu;$('asrWrap').hidden=!gpu;$('m2mWarn').hidden=server||state.m2m_installed;
}
document.querySelectorAll('input[name=backend]').forEach(r=>r.onchange=modeVis);
$('gpuHost').oninput=modeVis;

$('testBtn').onclick=async()=>{
  const b=$('testBtn');b.disabled=true;b.textContent=t('testing');$('testRes').innerHTML='';
  const j=await api('/api/simple/admin/test',{gpu_host:$('gpuHost').value,gpu_port:$('gpuPort').value,
    llm_url:$('llmUrl').value,llm_api_style:$('llmStyle').value,llm_api_key:$('llmKey').value});
  b.disabled=false;b.textContent=t('test');
  const out=[];
  if(j.gpu)out.push([j.gpu.ok,j.gpu.ok?t('gpu_ok')+(j.gpu.detail?`（${j.gpu.detail}）`:''):`${t('gpu_fail')}：${j.gpu.detail}`]);
  if(j.llm){out.push([j.llm.ok,j.llm.ok?t('llm_ok',{type:j.llm.type,n:j.llm.models.length}):`${t('llm_fail')}：${j.llm.detail}`]);
    if(j.llm.ok){$('modelList').innerHTML=j.llm.models.map(m=>`<option value="${m.replace(/"/g,'&quot;')}">`).join('');
      if(j.llm.style==='openwebui'&&$('llmStyle').value!=='openwebui'){$('llmStyle').value='openwebui';styleVis()}}}
  if(!j.ok&&!out.length)out.push([false,errMsg(j)]);
  for(const [ok,msg] of out){const d=document.createElement('div');d.className='res '+(ok?'ok':'err');d.textContent=msg;$('testRes').appendChild(d)}
};

$('pMain').onsubmit=async e=>{
  e.preventDefault();
  const j=await api('/api/simple/admin/save',{
    backend:document.querySelector('input[name=backend]:checked').value,
    gpu_host:$('gpuHost').value,gpu_port:$('gpuPort').value,
    llm_url:$('llmUrl').value,llm_api_style:$('llmStyle').value,llm_api_key:$('llmKey').value,clear_llm_api_key:$('clearKey').checked,
    llm_model:$('llmModel').value,summary_model:$('sumModel').value,asr_model:$('asrModel').value,
    local_live_model:$('liveModel').value,local_file_model:$('fileModel').value,diarize:$('diarize').checked,allow_remote_view:$('remoteView').checked,multi_lang:$('multiLang').checked,
    staff_password:$('staffPw').value,clear_staff_password:$('clearStaff').checked,
    update_check:$('updCheck').checked,update_who:$('updWho').value,update_share:$('updShare').value,support_contact:$('supContact').value});
  const r=$('saveRes');r.hidden=false;r.className='res '+(j.ok?'ok':'err');r.textContent=j.ok?t('saved'):errMsg(j);
  if(j.ok){state=j.state;rsShow();$('staffPw').value='';$('clearStaff').checked=false;$('clearStaffWrap').hidden=!state.staff_password_set;
    $('llmKey').value='';$('clearKey').checked=false;$('clearKeyWrap').hidden=!state.llm_api_key_set;applyLang()}
};

$('supMake').onclick=async()=>{
  const b=$('supMake'),x=$('supRes');b.disabled=true;b.textContent=t('sup_making');x.hidden=true;
  try{
    const r=await fetch('/api/simple/admin/report',{method:'POST',headers:{'Content-Type':'application/json','X-IT-Token':token},
      body:JSON.stringify({desc:'(IT)',logs:true,client:{ua:navigator.userAgent,lang,page:'admin',screen:innerWidth+'x'+innerHeight}})});
    if(!r.ok){const j=await r.json().catch(()=>({}));throw new Error(j.code==='it_password_wrong'?t('pw_wrong'):(j.error||j.code||r.status))}
    const m=/filename\*?=(?:UTF-8'')?"?([^";]+)/i.exec(r.headers.get('Content-Disposition')||''),name=m?decodeURIComponent(m[1]):'PCG-report.zip';
    const url=URL.createObjectURL(await r.blob()),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),60000);
    x.className='res ok';x.textContent=t('sup_done',{n:name});
  }catch(e){x.className='res err';x.textContent=t('sup_failed',{e:e.message||e})}
  x.hidden=false;b.disabled=false;b.textContent=t('sup_make');
};
$('chgPwBtn').onclick=async()=>{
  const p=prompt(t('new_it_pw'));if(!p)return;
  const j=await api('/api/simple/admin/password',{new:p});
  if(j.ok){token=p;sessionStorage.setItem('pcg_it',token);alert(t('pw_changed'))}else alert(errMsg(j));
};

/* ── 模型管理（模型包）── */
let models=null,mTimer=null;
const LANGS3=['id','vi','hi'];
const escH=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function loadModels(refresh){
  const j=await api('/api/simple/admin/models'+(refresh?'?refresh=1':''));
  if(!j.ok){$('mErr').hidden=false;$('mErr').textContent=errMsg(j);return}
  models=j;renderModels();if(state)fillLocalModels();
  const busy=Object.values(j.jobs||{}).some(x=>x.state==='downloading'||x.state==='installing');
  clearTimeout(mTimer);if(busy)mTimer=setTimeout(()=>loadModels(),2000);
}
function packOpts(lang,purpose,cur){
  const ps=(models.installed||[]).filter(p=>p.type==='asr'&&(p.languages||[]).includes(lang)&&(p.purpose||['live','file']).includes(purpose));
  return `<option value="">${escH(t('m_builtin'))}</option>`+ps.map(p=>`<option value="${escH(p.id)}"${p.id===cur?' selected':''}>${escH(p.name||p.id)}</option>`).join('');
}
function renderModels(){
  if(!models)return;
  const use=models.asr_packs||{};
  let h=`<span class="h">${escH(t('m_lang'))}</span><span class="h">${escH(t('m_live'))}</span><span class="h">${escH(t('m_file'))}</span>`;
  for(const l of LANGS3)h+=`<span>${escH(t('m_lang_'+l))}</span><select data-l="${l}" data-p="live">${packOpts(l,'live',(use[l]||{}).live)}</select><select data-l="${l}" data-p="file">${packOpts(l,'file',(use[l]||{}).file)}</select>`;
  const mts=(models.installed||[]).filter(p=>p.type==='mt');
  h+=`<span>${escH(t('m_mt'))}</span><select id="mMt" style="grid-column:span 2"><option value="">${escH(t('m_m2m'))}</option>`+
     mts.map(p=>`<option value="${escH(p.id)}"${p.id===models.mt_pack?' selected':''}>${escH(p.name||p.id)}</option>`).join('')+`</select>`;
  h+=`<span></span><p class="note" style="grid-column:span 2;margin:0">${escH(t('m_use_note'))}</p>`;
  $('mUse').innerHTML=h;
  const info=p=>[(p.languages||[]).map(l=>t('m_lang_'+l)!=='m_lang_'+l?t('m_lang_'+l):l).join('、'),p.size_mb?t('m_size',{n:p.size_mb}):'',p.version?t('m_ver',{v:p.version}):'',p.license||''].filter(Boolean).join(' · ');
  const inst=models.installed||[];
  $('mInst').innerHTML=inst.length?inst.map(p=>`<div class="mrow"><div><b>${escH(p.name||p.id)}</b><small>${escH(info(p))}</small>${p.note?`<small>${escH(p.note)}</small>`:''}</div>
    <button class="btn ghost" type="button" data-rm="${escH(p.id)}" data-n="${escH(p.name||p.id)}">${escH(t('m_remove'))}</button></div>`).join(''):`<p class="note">${escH(t('m_none_inst'))}</p>`;
  const av=(models.available||[]).filter(p=>!p.installed_version||p.update);
  $('mAvail').innerHTML=av.length?av.map(p=>{const jb=(models.jobs||{})[p.id]||{};let st='';
    if(jb.state==='downloading')st=`<small>${escH(t('m_dl',{a:jb.done_mb||0,b:jb.total_mb||p.size_mb||'?'}))}</small><div class="bar"><i style="width:${jb.total_mb?Math.min(100,100*(jb.done_mb||0)/jb.total_mb):0}%"></i></div>`;
    else if(jb.state==='installing')st=`<small>${escH(t('m_inst_ing'))}</small>`;
    else if(jb.state==='failed')st=`<small style="color:var(--err)">${escH(t('m_failed',{e:jb.error||''}))}</small>`;
    const busy=jb.state==='downloading'||jb.state==='installing';
    return `<div class="mrow"><div><b>${escH(p.name||p.id)}</b><small>${escH(info(p))} · ${escH(t(p.source_kind==='share'?'m_from_share':'m_from_gh'))}</small>${p.note?`<small>${escH(p.note)}</small>`:''}${st}</div>
    <button class="btn ghost" type="button" data-in="${escH(p.id)}"${busy?' disabled':''}>${escH(t(p.update?'m_update':'m_install'))}</button></div>`}).join(''):`<p class="note">${escH(t('m_none_avail'))}</p>`;
  const errs=models.catalog_errors||[];$('mErr').hidden=!errs.length;$('mErr').textContent=errs.join('；');
}
$('mInst').onclick=async e=>{const id=e.target.dataset?.rm;if(!id)return;
  if(!confirm(t('m_confirm_remove',{n:e.target.dataset.n})))return;
  const j=await api('/api/simple/admin/models/remove',{id});if(!j.ok)alert(errMsg(j));loadModels()};
$('mAvail').onclick=async e=>{const id=e.target.dataset?.in;if(!id)return;
  e.target.disabled=true;const j=await api('/api/simple/admin/models/install',{id});if(!j.ok)alert(errMsg(j));loadModels()};
$('mRefresh').onclick=()=>loadModels(true);
$('mApply').onclick=async()=>{
  const asr={};document.querySelectorAll('#mUse select[data-l]').forEach(s=>{if(s.value)(asr[s.dataset.l]=asr[s.dataset.l]||{})[s.dataset.p]=s.value});
  const j=await api('/api/simple/admin/models/use',{asr_packs:asr,mt_pack:$('mMt').value});
  const r=$('mUseRes');r.hidden=false;r.className='res '+(j.ok?'ok':'err');r.textContent=j.ok?t('models_applied'):errMsg(j);
  if(j.ok)loadModels();
};
applyLang();load();
</script>
</body>
</html>
