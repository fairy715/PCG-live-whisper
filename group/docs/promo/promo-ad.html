<style>
:root{--accent:#4c9dff;--ok:#3ecf8e;--ink:#f3f6fb;--dim:#a9b8d3;--warn:#ffb547}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1280px;height:720px;overflow:hidden;background:#050b18;color:var(--ink);

#bg{position:absolute;inset:0;background:radial-gradient(1200px 700px at 70% 20%,#16336b 0%,#0a1630 45%,#050b18 100%)}
#glow{position:absolute;width:900px;height:900px;border-radius:50%;background:radial-gradient(circle,rgba(76,157,255,.28),transparent 60%)}
#cv{position:absolute;inset:0}
.floorwrap{position:absolute;left:-400px;right:-400px;bottom:-260px;height:620px;perspective:700px}
.floor{position:absolute;inset:0;transform:rotateX(74deg);background-image:linear-gradient(rgba(76,157,255,.22) 1px,transparent 1px),linear-gradient(90deg,rgba(76,157,255,.22) 1px,transparent 1px);background-size:80px 80px;-webkit-mask-image:linear-gradient(to top,#000 10%,transparent 80%)}
#stage{position:absolute;inset:0;perspective:1300px}
#world{position:absolute;inset:0;transform-style:preserve-3d;transform-origin:640px 360px}
.st{position:absolute;left:0;top:0;width:1280px;height:720px;transform-origin:640px 360px;backface-visibility:hidden}

.av.t{background:#ffd166}.av.b{background:#7bdff2}

.slam{position:absolute;left:0;right:0;top:520px;text-align:center;font-size:56px;font-weight:900;letter-spacing:.02em}
.qm{position:absolute;font-size:46px;font-weight:900;color:var(--warn)}

.scr{position:relative;width:100%;height:100%;border-radius:8px;overflow:hidden;background:#f5f6f8}

.det{position:absolute;left:0;right:0;top:418px;text-align:center}

.ring{position:absolute;left:640px;top:560px;width:150px;height:150px;border-radius:50%;border:3px solid var(--ok);box-shadow:0 0 18px rgba(62,207,142,.45)}
.mic{position:absolute;left:622px;top:520px}.mic b{display:block;width:36px;height:36px;border-radius:18px;background:#c9d4ea;border:4px solid #8ea0c4}.mic u{display:block;width:6px;height:34px;background:#8ea0c4;margin:0 auto}
.seat{position:absolute;top:510px;display:flex;flex-direction:column;align-items:center;gap:8px;font-size:17px;color:var(--dim)}
.halo{position:absolute;top:-28px;left:50%;width:126px;height:126px;margin-left:-63px;border-radius:50%;background:radial-gradient(circle,rgba(62,207,142,.85) 0 40%,rgba(62,207,142,0) 70%)}
.seat .av{position:relative;z-index:1;width:70px;height:70px;font-size:24px}
.wave{position:absolute;left:150px;top:300px;width:330px;height:160px;display:flex;align-items:center;gap:6px}
.wave i{flex:1;background:linear-gradient(#7fc0ff,#4c9dff);border-radius:4px}
.arrow{position:absolute;left:520px;top:350px;font-size:60px;color:var(--accent);font-weight:900}
.doc{position:absolute;left:640px;top:175px;width:470px;height:430px;border-radius:18px;background:linear-gradient(160deg,#fff,#eef3ff);color:#1d2330;padding:24px 28px;font-size:17px;line-height:1.8;box-shadow:0 30px 80px rgba(0,0,0,.5);transform-origin:0 50%}

.trust{position:absolute;left:0;right:0;top:230px;display:flex;justify-content:center;gap:28px}

#fade{position:absolute;inset:0;background:#000;pointer-events:none}

const L2=[['zh','設備要先關電源，再做安全檢查。',FL,F.l2[0]],
          [FL,F.l2[1],'zh','手套也一定要戴嗎？'],
          ['zh','對，手套和安全帽都要。',FL,F.l2[2]]];
$('cards2').innerHTML=L2.map((x,i)=>`<div class="card" id="c2${i}" style="left:690px;top:${200+i*128}px"><div class="o">${tag(x[0])}${x[1]}</div><div class="t">${tag(x[2])}<span id="c2t${i}"></span></div></div>`).join('');
L2.forEach((x,i)=>$('lm'+i).innerHTML=`${tag(x[0])}${x[1]}<b>${x[3]}</b>`);
const PH=[[FL,F.l2[2]],['zh','對，手套和安全帽都要。'],[FL,F.l2[2]],['zh','對，手套和安全帽都要。'],[FL,F.l2[2]]];
$('phones').innerHTML=PH.map((p,i)=>`<div class="phone" id="ph${i}" style="left:${560+i*130}px;top:${215+Math.abs(i-2)*18}px"><div class="ln">${tag(p[0])}${p[1]}</div></div>`).join('');
(function(){const q=$('qr');const p='111111101100000110101110100101110100101110110101110100101111111101000000011010110101101011001011011101011100101011000001011110101011';for(let i=0;i<81;i++){const c=document.createElement('i');if(p[i%p.length]==='0')c.className='w';q.insertBefore(c,$('scan'))}})();
const ROOM=[['zh','請大家戴上安全帽。',F.room[0]],[FL,F.room[1],'安全帽要放在哪裡？'],['zh','放在門口的架子上。',F.room[2]]];
$('wave').innerHTML=[...Array(36)].map(()=>'<i></i>').join('');

// ── 工具 ──
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)),P=(t,a,b)=>cl((t-a)/(b-a));
const eo=x=>1-Math.pow(1-x,3),eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const back=x=>{const c=1.70158,c3=c+1;return 1+c3*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const css=(el,o,tr)=>{el.style.opacity=o;if(tr!==undefined)el.style.transform=tr};
const type=(el,s,p)=>{el.textContent=s.slice(0,Math.round(s.length*cl(p)))};
let seed=11;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
const PART=[...Array(90)].map(()=>({x:rnd()*1280,y:rnd()*720,z:.3+rnd()*.9,s:rnd()*6.28}));
const ctx=$('cv').getContext('2d');
// 各段落在 3D 空間的位置（x, z, 轉角）與鏡頭飛行時間（[開始飛, 抵達]）
const ST=[[0,0,0],[0,-1500,0],[1700,-1500,-28],[3000,-1100,-50],[4400,-1100,-14],[5800,-1500,16],[7100,-1500,0],[7100,-2900,0]];
const FLY=[[5.5,6.15],[9.3,10.3],[19.3,20.3],[23.3,24.3],[33.3,34.3],[39.3,40.1],[43.3,44.2]];
function camAt(t){let i=0;for(let k=0;k<FLY.length;k++)if(t>=FLY[k][0])i=k+1;
  if(i===0)return ST[0].slice();const [a,b]=FLY[i-1];const p=eio(P(t,a,b));const A=ST[i-1],B=ST[i];
  return [A[0]+(B[0]-A[0])*p,A[1]+(B[1]-A[1])*p,A[2]+(B[2]-A[2])*p, Math.sin(p*Math.PI)];}
document.querySelectorAll('.st').forEach((el,i)=>el.style.transform=`translate3d(${ST[i][0]}px,0,${ST[i][1]}px) rotateY(${ST[i][2]}deg)`);

function seek(t){
  // 背景
  ctx.clearRect(0,0,1280,720);const cam=camAt(t);
  for(const p of PART){const yy=((p.y-t*22*p.z)%720+720)%720,x=((p.x-cam[0]*.05*p.z+Math.sin(t*.5+p.s)*12*p.z)%1280+1280)%1280;
    ctx.globalAlpha=.15+.45*p.z*(.6+.4*Math.sin(t*2+p.s));ctx.fillStyle=p.z>.9?'#7fc0ff':'#4c9dff';ctx.beginPath();ctx.arc(x,yy,1+2.2*p.z,0,6.28);ctx.fill()}
  ctx.globalAlpha=1;$('floor').style.backgroundPosition=`${-cam[0]*.12}px ${t*40-cam[1]*.08}px`;
  $('glow').style.left=(560+Math.sin(t*.3)*180)+'px';$('glow').style.top=(-260+Math.cos(t*.25)*90)+'px';
  // 鏡頭：飛行中稍微後退，有「飛過去」的感覺
  $('world').style.transform=`translateZ(${-cam[3]*500}px) rotateY(${-cam[2]}deg) translate3d(${-cam[0]}px,0,${-cam[1]}px)`;
  ST.forEach((s,i)=>{const d=Math.hypot(s[0]-cam[0],s[1]-cam[1]);$('st'+i).style.opacity=cl(1.15-d/1500)});

  // 0 問題 0–6
  {const a=eo(P(t,.2,1));css($('a0t'),a,`translateX(${(1-a)*-200}px)`);css($('a0b'),a,`translateX(${(1-a)*200}px)`);css($('n0t'),a);css($('n0b'),a);
   const b1=P(t,.8,1.3);css($('b0a'),b1,`scale(${.4+.6*back(b1)})`);const b2=P(t,2,2.5);css($('b0b'),b2,`scale(${.4+.6*back(b2)})`);
   ['q1','q2','q3'].forEach((q,i)=>{const p=P(t,2.4+i*.25,2.8+i*.25);css($(q),p,`translateY(${-18*Math.sin(t*3+i)}px) scale(${back(p)})`)});
   const s=P(t,3.4,3.7);const sh=t>3.7&&t<4.1?Math.sin(t*90)*6:0;css($('slam'),s,`scale(${2.2-1.2*eo(s)}) translateX(${sh}px)`);}
  // 1 揭曉 6–10
  {$('flash').style.opacity=t>=6?Math.max(0,.85-(t-6)*2.2):0;
   const l=P(t,6,6.6);css($('logo'),l,`scale(${.3+.7*back(l)}) rotateZ(${(1-eo(l))*-25}deg)`);$('sw1').style.left=(-80+P(t,6.6,7.5)*260)+'%';
   const sk=P(t,6,7.2);css($('shock'),(1-sk)*.9,`scale(${.5+sk*6})`);
   [...$('name1').children].forEach((c,i)=>{const p=eo(P(t,6.5+i*.04,7.1+i*.04));css(c,p,`perspective(800px) translateZ(${(1-p)*400}px) translateY(${(1-p)*30}px)`)});
   const tg=eo(P(t,7.4,8.2));css($('tag1'),tg,`translateY(${(1-tg)*20}px)`);}
  // 2 線上課 10–20
  {const lo=eo(P(t,10,11));css($('lap'),lo,`perspective(1400px) rotateY(${18-lo*6}deg) rotateX(4deg) translateX(${(1-lo)*-200}px)`);
   $('lid').style.transform=`perspective(1400px) rotateX(${(1-eio(P(t,10.3,11.2)))*-80}deg)`;
   // 游標點兩下（新介面）：場合「我也要說話」→ 對方的語言，畫面跟著換成選好的樣子，然後切到字幕畫面
   const [[ax,ay],[bx,by]]=CLK;
   const m1=eio(P(t,11.0,11.7)),m2=eio(P(t,12.2,12.8));
   const cx=360+(ax-360)*m1+(bx-ax)*m2,cy=250+(ay-250)*m1+(by-ay)*m2;
   css($('cur'),t>10.9&&t<13.6?1:0,`translate(${cx}px,${cy}px)`);
   const r1=P(t,11.75,12.25),r2=P(t,12.85,13.35),r=t<12.5?r1:r2,[rx,ry]=t<12.5?[ax,ay]:[bx,by];
   css($('rip'),(t>11.75&&t<12.25)||(t>12.85&&t<13.35)?1-r:0,`translate(${rx+10}px,${ry+10}px) scale(${.3+r*1.4})`);
   css($('ui'),1);$('uiB').style.opacity=t>=11.8?1:0;$('uiC').style.opacity=t>=12.9?1:0;
   const lv=P(t,13.3,13.8);$('liveV').style.opacity=lv;
   ['lm0','lm1','lm2'].forEach((m,i)=>{const p=eo(P(t,13.6+i*2,14.1+i*2));css($(m),p,`translateY(${(1-p)*20}px)`)});
   const T2=[13.6,15.6,17.6];L2.forEach((x,i)=>{const p=eo(P(t,T2[i],T2[i]+.7));css($('c2'+i),p,`perspective(1200px) translateX(${(1-p)*260}px) rotateY(${(1-p)*-35}deg)`);type($('c2t'+i),x[3],P(t,T2[i]+.6,T2[i]+(x[2]==='zh'?1.3:1.8)))});
   css($('h2'),eo(P(t,10.2,10.9)));css($('s2'),eo(P(t,10.5,11.2)));css($('cap2'),eo(P(t,18.2,18.8)));}
  // 3 手機 20–24
  {css($('h3'),eo(P(t,20.2,20.8)));css($('s3'),eo(P(t,20.5,21.1)));
   const q=P(t,20.2,20.8);css($('qr'),q,`perspective(1200px) rotateY(${16-P(t,20,24)*10}deg) scale(${.6+.4*back(q)})`);
   $('scan').style.top=(10+((t*1.4)%1)*250)+'px';
   PH.forEach((p,i)=>{const pp=P(t,20.8+i*.18,21.4+i*.18);css($('ph'+i),pp,`perspective(1200px) rotateY(${(i-2)*-14}deg) translateY(${(1-back(pp))*120}px) translateY(${Math.sin(t*2+i)*6}px)`)});}
  // 4 教室 24–34
  {css($('h4'),eo(P(t,24.2,24.8)));css($('s4'),eo(P(t,24.5,25.1)));
   const pj=eo(P(t,24.4,25.2));css($('proj'),pj,`perspective(1400px) rotateX(${(1-pj)*40}deg)`);
   const S=[25.4,28.6,31.6];let cur=-1;S.forEach((s,i)=>{if(t>=s)cur=i});
   [$('r1'),$('r2')].forEach((r,i)=>{const ph=(t*1.1+i*.5)%1;r.style.transform=`translate(-50%,-50%) scale(${.15+ph*1.5})`;r.style.opacity=t>25?(1-ph)*.8:0});
   if(cur>=0){const [l,o,tr]=ROOM[cur];$('pO').textContent=o;type($('pT'),tr,P(t,S[cur]+.4,S[cur]+(l==='zh'?1.6:1.1)));
     $('det').textContent=X.det+(l==='zh'?X.lzh:X.lid);const f=P(t,S[cur],S[cur]+.35);$('det').style.transform=`perspective(600px) rotateX(${(1-eo(f))*90}deg)`;
     const pu=.75+.25*Math.sin(t*6);$('hT').style.opacity=l==='zh'?pu:0;$('hB').style.opacity=l!=='zh'?pu:0;}
   else{$('pO').textContent='';$('pT').textContent='';$('det').textContent='';$('hT').style.opacity=0;$('hB').style.opacity=0}}
  // 5 會後 34–40
  {css($('h5'),eo(P(t,34.2,34.8)));css($('s5'),eo(P(t,34.5,35.1)));
   [...$('wave').children].forEach((b,i)=>{const on=P(t,34.4+i*.02,34.8+i*.02);b.style.height=(on*(20+70*Math.abs(Math.sin(i*.7+t*5))*(.6+.4*Math.sin(i*.31))))+'%'});
   css($('arr'),eo(P(t,35.4,36)),`translateX(${(1-eo(P(t,35.4,36)))*-40}px)`);
   const dp=eio(P(t,35.6,36.8));css($('doc'),cl(dp*2),`perspective(1400px) rotateY(${(1-dp)*90-10}deg)`);
   [...$('doc').querySelectorAll('.dl,.k')].forEach((l,i)=>{const p=P(t,36.6+i*.25,36.9+i*.25);l.style.opacity=p});
   [...$('doc').querySelectorAll('.dl')].forEach((l,i)=>l.classList.toggle('hl',t>38+i*.4&&t<38.4+i*.4))}
  // 6 信任 40–44（每一拍一張）
  {['t1','t2','t3'].forEach((k,i)=>{const p=P(t,40.1+i,40.45+i);css($(k),p,`perspective(1000px) scale(${1.6-0.6*eo(p)}) rotateX(${(1-eo(p))*30}deg)`)});
   css($('t4'),eo(P(t,42.8,43.3)));}
  // 7 行動呼籲 44–48.5
  {const l=eo(P(t,44.2,45));css($('logo7'),l,`perspective(800px) rotateY(${(1-l)*-120}deg)`);$('sw7').style.left=(-80+P(t,45,45.9)*260)+'%';
   const ln=P(t,44.6,45.3);css($('line7'),ln,`scale(${1.4-.4*eo(ln)})`);css($('name7'),eo(P(t,45.5,46.1)));
   const c=P(t,46,46.6);css($('cta7'),c,`scale(${.6+.4*back(c)})`);}
  $('fade').style.opacity=Math.max(1-P(t,0,.3),P(t,47.6,48.5));
}
window.seek=seek;seek(0);
if(!/render/.test(location.search)){const t0=performance.now();(function loop(){const t=(performance.now()-t0)/1000;seek(t);if(t<48.5)requestAnimationFrame(loop)})()}
</script>
