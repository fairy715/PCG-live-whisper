<style>

*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1280px;height:720px;overflow:hidden;background:#050b18;color:var(--ink);

#bg{position:absolute;inset:0;background:radial-gradient(1200px 700px at 70% 20%,#16336b 0%,#0a1630 45%,#050b18 100%)}
#glow{position:absolute;width:900px;height:900px;border-radius:50%;background:radial-gradient(circle,rgba(76,157,255,.28),transparent 60%);filter:blur(10px)}
#cv{position:absolute;inset:0}
.floorwrap{position:absolute;left:-400px;right:-400px;bottom:-260px;height:620px;perspective:700px}
.floor{position:absolute;inset:0;transform:rotateX(74deg);background-image:linear-gradient(rgba(76,157,255,.22) 1px,transparent 1px),linear-gradient(90deg,rgba(76,157,255,.22) 1px,transparent 1px);background-size:80px 80px;

.scene{position:absolute;inset:0;perspective:1400px;opacity:0}
.cam{position:absolute;inset:0;transform-style:preserve-3d}
.tag{position:absolute;left:80px;top:54px;font-size:18px;letter-spacing:.14em;color:var(--accent);font-weight:800}

.p3{transform-style:preserve-3d;position:absolute}

.big{font-size:72px;font-weight:900;letter-spacing:.01em;white-space:nowrap}
.big span{display:inline-block}
.chip{display:inline-block;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.22);border-radius:999px;padding:10px 22px;font-size:21px;margin:0 6px}

.lid .scr{width:100%;height:100%;border-radius:8px;background:linear-gradient(160deg,#0f1b33,#0b1326);display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px}
.kb{position:absolute;left:-25px;bottom:-300px;width:520px;height:300px;transform-origin:50% 0%;transform:rotateX(90deg);border-radius:0 0 22px 22px;

.kb::after{content:"";position:absolute;left:40px;right:40px;top:30px;height:170px;border-radius:8px;background:repeating-linear-gradient(90deg,#24325a 0 30px,#1b2643 30px 34px),#24325a;opacity:.7}
.tile{border-radius:10px;background:#1b2a4a;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:14px;color:var(--dim)}
.av{width:60px;height:60px;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:20px;color:#0b1a33}
.av.t{background:#ffd166}.av.s{background:#7bdff2}
.card{position:absolute;width:560px;border-radius:18px;padding:16px 20px;background:linear-gradient(160deg,#ffffff,#eef3ff);color:#1d2330;

.lg.zh{background:#e5484d}.lg.id{background:#1f6feb}

.phone .ln{background:#fff;color:#1d2330;border-radius:10px;padding:8px;font-size:14px;font-weight:800;line-height:1.35}

.seat{position:absolute;top:330px;display:flex;flex-direction:column;align-items:center;gap:8px;font-size:16px;color:var(--dim)}
.halo{position:absolute;top:-26px;left:50%;width:112px;height:112px;margin-left:-56px;border-radius:50%;background:radial-gradient(circle,rgba(62,207,142,.8) 0 42%,rgba(62,207,142,0) 70%);opacity:0}
.seat .av{position:relative;z-index:1}
.mic{position:absolute;left:262px;top:322px;width:36px;height:70px}
.mic b{display:block;width:36px;height:36px;border-radius:18px;background:#c9d4ea;border:4px solid #8ea0c4}
.mic u{display:block;width:6px;height:30px;background:#8ea0c4;margin:0 auto}
.ring{position:absolute;left:280px;top:340px;width:140px;height:140px;border-radius:50%;border:3px solid var(--ok);box-shadow:0 0 18px rgba(62,207,142,.5)}
.det{position:absolute;left:720px;top:225px;font-size:22px;font-weight:900;border-radius:999px;padding:10px 22px;background:rgba(62,207,142,.15);border:1.5px solid var(--ok);color:var(--ok);white-space:nowrap}
.feat{position:absolute;width:490px;border-radius:16px;padding:16px 20px;background:linear-gradient(160deg,rgba(40,62,110,.92),rgba(22,36,70,.92));border:1px solid rgba(255,255,255,.16);box-shadow:0 18px 40px rgba(0,0,0,.35)}

#fade{position:absolute;inset:0;background:#000;pointer-events:none}

const P=(t,a,b)=>cl((t-a)/(b-a));
const eo=x=>1-Math.pow(1-x,3), eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const back=x=>{const c=1.70158,c3=c+1;return 1+c3*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
function sceneOp(t,a,b,fi=.7,fo=.7){return Math.min(P(t,a,a+fi),1-P(t,b-fo,b))}
function typeTo(el,text,p){const n=Math.round(text.length*cl(p));el.textContent=text.slice(0,n)}
function css(el,o,tr){el.style.opacity=o;if(tr!==undefined)el.style.transform=tr}
// 背景粒子（固定亂數種子，每一格位置由時間決定）
let seed=11;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
const PART=[...Array(90)].map(()=>({x:rnd()*1280,y:rnd()*720,z:.3+rnd()*.9,s:rnd()*6.28}));
const ctx=$('cv').getContext('2d');
function bg(t){
  ctx.clearRect(0,0,1280,720);
  for(const p of PART){const y=(p.y-t*22*p.z)%720,yy=y<0?y+720:y,x=p.x+Math.sin(t*.5+p.s)*12*p.z;
    ctx.globalAlpha=.15+.45*p.z*(.6+.4*Math.sin(t*2+p.s));ctx.fillStyle=p.z>.9?'#7fc0ff':'#4c9dff';
    ctx.beginPath();ctx.arc(x,yy,1+2.2*p.z,0,6.28);ctx.fill()}
  ctx.globalAlpha=1;
  $('floor').style.backgroundPosition=`0 ${t*40}px`;
  const g=$('glow');g.style.left=(560+Math.sin(t*.3)*180)+'px';g.style.top=(-260+Math.cos(t*.25)*90)+'px';
}

function seek(t){
  bg(t);
  // ── 0–6 開場 ──
  {const o=sceneOp(t,0,6.2,.3,.8);$('S0').style.opacity=o;
   const lp=eo(P(t,.2,1.6));css($('logo'),lp,`rotateY(${(1-lp)*100}deg) translateZ(${(1-lp)*-400}px) scale(${.6+.4*back(P(t,.2,1.6))})`);
   $('sw0').style.left=(-80+P(t,1.4,2.4)*260)+'%';
   [...$('title0').children].forEach((s,i)=>{const p=eo(P(t,1.2+i*.06,1.9+i*.06));css(s,p,`translateZ(${(1-p)*500}px) rotateX(${(1-p)*-70}deg) translateY(${(1-p)*30}px)`)});
   css($('tag0'),eo(P(t,2.4,3.2)),`translateY(${(1-eo(P(t,2.4,3.2)))*20}px)`);
   [...$('chips0').children].forEach((c,i)=>{const p=P(t,3.2+i*.15,3.8+i*.15);css(c,p,`scale(${.3+.7*back(p)}) rotateX(${(1-p)*60}deg)`)});
   $('C0').style.transform=`translateZ(${P(t,5.4,6.2)*-600}px) rotateX(${P(t,5.4,6.2)*20}deg)`;}
  // ── 6–22 情境一 ──
  {const o=sceneOp(t,6,22);$('S1').style.opacity=o;
   const cam=P(t,6,22);$('C1').style.transform=`translateZ(${(1-eo(P(t,6,7.2)))*-300 + P(t,21.3,22)*400}px) rotateY(${(cam-.5)*-6}deg)`;
   const lo=eo(P(t,6.4,7.8));const lid=eio(P(t,7.4,8.6));
   css($('lap'),lo,`translateX(${(1-lo)*-500}px) rotateY(${-26+cam*10}deg) rotateX(-14deg)`);
   $('lid').style.transform=`rotateX(${(1-lid)*-88}deg)`;
   const T=[8.8,12.4,16];
   LINES.forEach((x,i)=>{const p=eo(P(t,T[i],T[i]+.9));css($('cd'+i),p,`translateX(${(1-p)*300}px) translateZ(${(1-p)*-400}px) rotateY(${(1-p)*-40}deg)`);
     typeTo($('ct'+i),x[3],P(t,T[i]+.9,T[i]+(x[2]==='zh'?1.9:2.6)))});
   const cp=eo(P(t,19,19.8));css($('cap1'),cp,`translateY(${(1-cp)*30}px)`);}
  // ── 22–30 QR 與手機 ──
  {const o=sceneOp(t,22,30.2);$('S2').style.opacity=o;
   $('C2').style.transform=`translateZ(${(1-eo(P(t,22,23)))*-300 + P(t,29.5,30.2)*400}px)`;
   const q=back(P(t,22.5,23.5));css($('qr'),P(t,22.5,23.2),`rotateY(${18-P(t,22.5,30)*14}deg) rotateX(6deg) scale(${.5+.5*q})`);
   $('swq').style.left=(-80+((t-23)%3)/3*300)+'%';css($('qrl'),eo(P(t,23.2,24)));
   const rot=20-P(t,23,30)*60;$('car').style.transform=`rotateX(-8deg) rotateY(${rot}deg)`;
   PH.forEach((p,i)=>{const a=(i-2)*34,pp=eo(P(t,23+i*.25,24+i*.25));
     css($('ph'+i),pp,`rotateY(${a}deg) translateZ(${280+(1-pp)*300}px)`)});}
  // ── 30–42 教室模式 ──
  {const o=sceneOp(t,30,42.2);$('S3').style.opacity=o;
   $('C3').style.transform=`translateZ(${(1-eo(P(t,30,31.2)))*-300 + P(t,41.5,42.2)*400}px)`;
   const ro=eo(P(t,30.3,31.5));css($('room'),ro,`rotateX(${10+(1-ro)*30}deg) rotateY(${22-P(t,30,42)*30}deg) translateZ(${(1-ro)*-300}px)`);
   const S=[32,35.5,39];let cur=-1;S.forEach((s,i)=>{if(t>=s)cur=i});
   [ $('r1'),$('r2') ].forEach((r,i)=>{const ph=((t*1.1+i*.5)%1);r.style.transform=`translate(-50%,-50%) scale(${.15+ph*1.4})`;r.style.opacity=t>31.5?(1-ph)*.8:0});
   if(cur>=0){const [l,src,dst]=ROOM[cur];$('projO').textContent=src;typeTo($('projT'),dst,P(t,S[cur]+.5,S[cur]+(l==='zh'?2.2:1.4)));
     $('detL').textContent=l==='zh'?TX.lzh:TX.lid;
     const flip=P(t,S[cur],S[cur]+.4);$('det').style.transform=`rotateX(${(1-eo(flip))*90}deg)`;
     const pulse=.75+.25*Math.sin(t*6);$('hT').style.opacity=l==='zh'?pulse:0;$('hS').style.opacity=l==='id'?pulse:0;
   }else{$('projO').textContent='';$('projT').textContent='';$('detL').textContent=''}
   $('det').style.opacity=eo(P(t,31.6,32.2));
   ['f31','f32','f33'].forEach((f,i)=>{const p=eo(P(t,32.5+i*.5,33.3+i*.5));css($(f),p,`translateX(${(1-p)*200}px) rotateY(${(1-p)*-50}deg)`)});}
  // ── 42–52 開會的電腦 ──
  {const o=sceneOp(t,42,52.2);$('S4').style.opacity=o;
   $('C4').style.transform=`translateZ(${(1-eo(P(t,42,43.2)))*-300 + P(t,51.5,52.2)*400}px) rotateY(${(P(t,42,52)-.5)*-5}deg)`;
   ['f41','f42','f43','f44'].forEach((f,i)=>{const p=P(t,42.8+i*.4,43.6+i*.4);css($(f),p,`perspective(1200px) rotateX(${(1-back(p))*-90}deg)`);$(f).style.transformOrigin='50% 0'});
   const dp=eio(P(t,45.2,46.6));css($('doc'),cl(dp*2),`perspective(1200px) rotateY(${(1-dp)*95-14}deg) translateZ(${(1-dp)*-200}px)`);
   [...$('doc').querySelectorAll('.dl')].forEach((l,i)=>{l.className='dl'+(t>47+i*.8&&t<47.8+i*.8?' hl':'')});}
  // ── 52–60 結尾 ──
  {const o=sceneOp(t,52,61,.7,.1);$('S5').style.opacity=o;
   const lp=eo(P(t,52.3,53.5));css($('logo5'),lp,`rotateY(${(1-lp)*-120}deg) scale(${.5+.5*back(P(t,52.3,53.5))})`);
   $('sw5').style.left=(-80+P(t,53.5,54.5)*260)+'%';
   const tp=eo(P(t,53,54));css($('title5'),tp,`translateZ(${(1-tp)*400}px)`);
   css($('sub5'),eo(P(t,53.8,54.6)));
   [...$('chips5').children].forEach((c,i)=>{const p=P(t,54.4+i*.15,55+i*.15);css(c,p,`scale(${.3+.7*back(p)})`)});
   const cp=P(t,55.4,56.2);css($('cta'),cp,`scale(${.6+.4*back(cp)})`);
   $('cta').style.boxShadow=`0 20px ${50+20*Math.sin(t*4)}px rgba(76,157,255,${.35+.2*Math.sin(t*4)})`;}
  $('fade').style.opacity=Math.max(1-P(t,0,.5),P(t,59.2,60.5));
}
window.seek=seek;seek(0);
// 直接打開時自動播放（錄影用 seek 逐格）
if(!/render/.test(location.search)){const t0=performance.now();(function loop(){const t=(performance.now()-t0)/1000;seek(t);if(t<61)requestAnimationFrame(loop)})()}
</script>
</body>
</html>
