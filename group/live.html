<!DOCTYPE html>
<!-- PCG 集團版：精簡字幕畫面（/simple/live）。字幕內容來自 WebUI 的 /ws 即時推送（transcription 事件）。
     「我要看的語言」：每一句用看的人選的語言大字顯示（雙向會議裡，兩種語言的版本都有）。
     介面五種語言，與簡易頁面共用 localStorage 的 pcg_lang -->
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PCG Live Subtitles</title>
<link rel="icon" href="/favicon.png">
<style>
:root{--bg:#f5f6f8;--card:#fff;--text:#1d2330;--dim:#5d6676;--line:#dde1e7;--accent:#1f6feb;--accent-ink:#fff;--accent-soft:#e7f0ff;
  --me:#e3f4ea;--me-line:#1a7f37;--err:#cf222e;--warn:#9a6700;--fs:22px}
@media (prefers-color-scheme:dark){:root{--bg:#0f1218;--card:#171b23;--text:#e6e9ef;--dim:#98a1b2;--line:#2a303b;--accent:#4c8dff;--accent-ink:#0b0e13;
  --accent-soft:#1a2740;--me:#13261b;--me-line:#4ac26b;--err:#ff6b6b;--warn:#d4a72c}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);display:flex;flex-direction:column;
  font:16px/1.5 -apple-system,"Segoe UI","PingFang TC","Microsoft JhengHei","Noto Sans TC","Noto Sans Devanagari","Nirmala UI",sans-serif}
header{flex:none;display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--card)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--dim);flex:none}
.dot.on{background:#2da44e;box-shadow:0 0 0 4px rgba(45,164,78,.2)}
.st{font-weight:700}
.mode{color:var(--dim);font-size:14px}
.mode.xl{color:var(--accent);font-weight:600}
.mylang{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--dim)}
.sp{flex:1}
select,button{font:inherit}
select{color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:6px 8px}
.ic{appearance:none;border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:10px;padding:6px 10px;cursor:pointer;font-weight:600;min-width:44px}
main{flex:1;overflow-y:auto;padding:16px}
.msgs{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.m{max-width:80%;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:12px;padding:10px 14px}
.m.me{align-self:flex-end;background:var(--me);border-left-color:var(--me-line)}
.m .p{font-size:var(--fs);font-weight:600;line-height:1.35}
.m .s{font-size:calc(var(--fs) * .68);color:var(--dim);margin-top:4px}
.m .t{font-size:12px;color:var(--dim);margin-bottom:2px}
.tag{display:inline-block;font-size:11px;font-weight:700;border-radius:6px;padding:0 5px;margin-right:6px;background:var(--bg);color:var(--dim);vertical-align:middle}
.empty{color:var(--dim);text-align:center;margin-top:20vh;font-size:18px}
/* 字幕模式：黑底大字、只留最新兩句 */
body.sub main{background:#000}
body.sub .m{display:none;max-width:none;background:none;border:0;text-align:center;align-self:stretch}
body.sub .m:nth-last-child(-n+2){display:block}
body.sub .m .p{color:#ffd400;font-size:calc(var(--fs) * 1.6)}
body.sub .m .s{color:#ddd;font-size:calc(var(--fs) * .9)}
body.sub .m .t{display:none}
body.sub .msgs{min-height:100%;justify-content:flex-end;padding-bottom:4vh}
body.sub .empty{color:#888}
footer{flex:none;display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:10px 16px;border-top:1px solid var(--line);background:var(--card)}
.btn{appearance:none;border:0;border-radius:10px;padding:10px 16px;font-weight:700;cursor:pointer;background:var(--accent);color:var(--accent-ink)}
.btn.stop{background:var(--err);color:#fff}
.btn.ghost{background:none;border:1.5px solid var(--accent);color:var(--accent)}
.ver{color:var(--dim);font-size:12px;cursor:copy;user-select:all}
.chk{display:flex;gap:6px;align-items:center;font-size:14px;color:var(--dim);cursor:pointer}
.banner{max-width:980px;margin:0 auto 12px;border-radius:12px;padding:12px 14px;background:var(--accent-soft);display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.banner.end{background:#fff4d6;color:var(--warn);position:sticky;top:0;z-index:2}      /* r33：字幕多的時候畫面停在最下面，結束的說明與「下載逐字稿」要一直看得到 */
@media (prefers-color-scheme:dark){.banner.end{background:#2a2310}}
dialog{border:0;border-radius:16px;padding:22px;background:var(--card);color:var(--text);width:min(420px,94vw)}
dialog::backdrop{background:rgba(0,0,0,.5)}
.qr{display:block;width:240px;height:240px;margin:8px auto;background:#fff;border-radius:12px;padding:8px}
.url{font-family:ui-monospace,Consolas,monospace;font-size:15px;word-break:break-all;background:var(--bg);border-radius:8px;padding:8px 10px;margin:6px 0}
.note{font-size:14px;color:var(--dim);margin:8px 0}
.warn{color:var(--warn)}
/* r29：狀態圖示（只在「等聲音、重新連線」時會動；字幕在跑時靜止）、頁面內的密碼視窗、字級檔位 */
.sti{display:inline-flex;color:var(--me-line)}.sti.warn{color:var(--warn)}.sti.still{--ul-play:paused}
.empty .ul-i{--ul-size:40px;display:block;margin:0 auto 10px;color:var(--dim)}
#pwDlg{width:min(380px,92vw)}#pwDlg input{width:100%;font:inherit;font-size:18px;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;margin:8px 0;background:var(--card);color:var(--text)}
#pwDlg .err{color:var(--err);font-size:14px;margin:0 0 8px}
/* ul-icons:begin — Ultra Lab Motion Icons v0.3.1（MIT License，(c) Ultra Lab，https://github.com/ppcvote/ultralab-anim-icons）。
   只取用到的幾個圖示，內嵌在這裡（公司電腦可能不能上網）；只用在「狀態」，系統開了「減少動態效果」時不會動 */
.ul-i{width:var(--ul-size,24px);height:var(--ul-size,24px);stroke-width:var(--ul-stroke,1.5);overflow:visible;vertical-align:middle;flex:none}
.ul-i *{transform-box:view-box;transform-origin:12px 12px}

.ul-translate .p{animation:ul-translate-p calc(3.6s / var(--ul-speed,1)) ease-in-out calc(0s / var(--ul-speed,1)) infinite;animation-play-state:var(--ul-play,running)}.ul-translate .q{animation:ul-translate-q calc(3.6s / var(--ul-speed,1)) ease-in-out calc(0s / var(--ul-speed,1)) infinite;animation-play-state:var(--ul-play,running)}@keyframes ul-translate-p{0%,15%{transform:translate(0,0)}45%,65%{transform:translate(8px,8px)}95%,100%{transform:translate(0,0)}}@keyframes ul-translate-q{0%,15%{transform:translate(0,0)}45%,65%{transform:translate(-8px,-8px)}95%,100%{transform:translate(0,0)}}
.ul-summarize .l1{animation:ul-summarize-l1 calc(3.6s / var(--ul-speed,1)) ease-in-out calc(0s / var(--ul-speed,1)) infinite;animation-play-state:var(--ul-play,running)}@keyframes ul-summarize-l1{0%,8%{opacity:1;transform:translateY(0) scaleX(1)}38%,68%{opacity:0;transform:translateY(6px) scaleX(.5)}92%,100%{opacity:1;transform:translateY(0) scaleX(1)}}.ul-summarize .l2{animation:ul-summarize-l2 calc(3.6s / var(--ul-speed,1)) ease-in-out calc(0s / var(--ul-speed,1)) infinite;animation-play-state:var(--ul-play,running)}@keyframes ul-summarize-l2{0%,8%{opacity:1;transform:translateY(0) scaleX(1)}38%,68%{opacity:0;transform:translateY(2px) scaleX(.5)}92%,100%{opacity:1;transform:translateY(0) scaleX(1)}}.ul-summarize .l3{animation:ul-summarize-l3 calc(3.6s / var(--ul-speed,1)) ease-in-out calc(0s / var(--ul-speed,1)) infinite;animation-play-state:var(--ul-play,running)}@keyframes ul-summarize-l3{0%,8%{opacity:1;transform:translateY(0) scaleX(1)}38%,68%{opacity:0;transform:translateY(-2px) scaleX(.5)}92%,100%{opacity:1;transform:translateY(0) scaleX(1)}}.ul-summarize .l4{animation:ul-summarize-l4 calc(3.6s / var(--ul-speed,1)) ease-in-out calc(0s / var(--ul-speed,1)) infinite;animation-play-state:var(--ul-play,running)}@keyframes ul-summarize-l4{0%,8%{opacity:1;transform:translateY(0) scaleX(1)}38%,68%{opacity:0;transform:translateY(-6px) scaleX(.5)}92%,100%{opacity:1;transform:translateY(0) scaleX(1)}}.ul-summarize .r{animation:ul-summarize-r calc(3.6s / var(--ul-speed,1)) ease-in-out calc(0s / var(--ul-speed,1)) infinite;animation-play-state:var(--ul-play,running)}@keyframes ul-summarize-r{0%,30%{opacity:0;transform:scaleX(.6)}42%,64%{opacity:1;transform:scaleX(1)}74%,100%{opacity:0;transform:scaleX(.6)}}
.ul-sync .g{animation:ul-sync-turn calc(2.4s / var(--ul-speed,1)) cubic-bezier(.65,0,.35,1) calc(0s / var(--ul-speed,1)) infinite;animation-play-state:var(--ul-play,running)}@keyframes ul-sync-turn{0%{transform:rotate(0)}55%,100%{transform:rotate(180deg)}}
.ul-upload .a{animation:ul-upload-up calc(2.2s / var(--ul-speed,1)) ease-in-out calc(0s / var(--ul-speed,1)) infinite;animation-play-state:var(--ul-play,running)}@keyframes ul-upload-up{0%{opacity:0;transform:translateY(3px)}22%,62%{opacity:1;transform:translateY(0)}88%,100%{opacity:0;transform:translateY(-4px)}}
.ul-download .a{animation:ul-download-down calc(2.2s / var(--ul-speed,1)) ease-in-out calc(0s / var(--ul-speed,1)) infinite;animation-play-state:var(--ul-play,running)}.ul-download .t{animation:ul-download-dip calc(2.2s / var(--ul-speed,1)) ease-in-out calc(0s / var(--ul-speed,1)) infinite;animation-play-state:var(--ul-play,running)}@keyframes ul-download-down{0%{opacity:0;transform:translateY(-4px)}25%,60%{opacity:1;transform:translateY(0)}82%,100%{opacity:0;transform:translateY(3px)}}@keyframes ul-download-dip{0%,70%,100%{transform:translateY(0)}80%{transform:translateY(1px)}}
.ul-connecting .o1{animation:ul-connecting-cw calc(3.6s / var(--ul-speed,1)) linear calc(0s / var(--ul-speed,1)) infinite;animation-play-state:var(--ul-play,running)}.ul-connecting .o2{animation:ul-connecting-ccw calc(2.16s / var(--ul-speed,1)) linear calc(0s / var(--ul-speed,1)) infinite;animation-play-state:var(--ul-play,running)}@keyframes ul-connecting-cw{to{transform:rotate(360deg)}}@keyframes ul-connecting-ccw{to{transform:rotate(-360deg)}}
/* ul-icons:end */
[hidden]{display:none!important}
/* r32：打字回覆（只在收音的這台電腦、字幕進行中） */
#sayBar{flex:none;border-top:1px solid var(--line);background:var(--card);padding:10px 16px}
#sayForm{display:flex;gap:8px;align-items:center;max-width:980px;margin:0 auto}
#sayIn{flex:1;min-width:0;font:inherit;font-size:17px;min-height:44px;padding:8px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text)}
#saySwap{white-space:nowrap;font-weight:600;font-size:14px}
.saycard{max-width:980px;margin:0 auto 10px;border:2px solid var(--me-line);background:var(--me);border-radius:14px;padding:12px 16px}
.saycard .h{font-size:13px;color:var(--dim);margin-bottom:4px}
.saycard .o{font-size:calc(var(--fs) * 1.6);font-weight:700;line-height:1.3;overflow-wrap:anywhere}
.saycard .o.err{font-size:17px;color:var(--err);font-weight:600}
.saycard .i{font-size:14px;color:var(--dim);margin-top:6px;overflow-wrap:anywhere}
.saycard .a{display:flex;gap:8px;justify-content:flex-end;margin-top:8px}
.saycard .btn{padding:8px 14px}
@media (max-width:560px){#sayBar{padding:8px 12px}#sayForm{flex-wrap:wrap}#saySwap{flex:1 0 100%;text-align:left}}
.ic,select{min-height:44px}.chk{min-height:44px;display:inline-flex;align-items:center}
@media (max-width:560px){.m{max-width:94%}
  /* r30：手機上方的控制列收成兩列（狀態＋語言與字級；這一場的語言），原本會排成四列、佔掉字幕的空間 */
  header{gap:4px 8px;padding:8px 12px}header .st{font-size:15px}
  .mylang span{display:none}.mylang select{max-width:40vw}
  header .mode{order:9;font-size:12px}header .mode.xl{order:10}
  footer{gap:8px;padding:8px 12px}}
</style>
</head>
<body>
<header>
  <span class="dot" id="dot"></span><span class="sti" id="sti" hidden></span><span class="st" id="st" role="status"></span><span class="mode" id="mode"></span><span class="mode xl" id="xl" hidden></span>
  <span class="sp"></span>
  <label class="mylang"><span id="myLangL"></span><select id="langSel" aria-label="Language"></select></label>
  <button class="ic" id="fsDn" type="button" aria-label="A-">A−</button><button class="ic" id="fsUp" type="button" aria-label="A+">A+</button>
</header>
<main id="main">
  <div class="banner end" id="endBanner" hidden><span id="endText"></span><a class="btn ghost" href="/simple" id="backBtn"></a>
    <a class="btn" id="trDl" hidden download></a><button class="btn ghost" id="trMin" type="button" hidden></button><span class="note" id="trNote" style="margin:0;flex-basis:100%" hidden></span></div>
  <div class="msgs" id="msgs" role="log" aria-live="polite" aria-relevant="additions"><div class="empty" id="empty"></div></div>
</main>
<section id="sayBar" hidden>
  <div class="saycard" id="sayCard" hidden aria-live="polite">
    <div class="h" id="sayHead"></div>
    <div class="o" id="sayOut"></div>
    <div class="i" id="saySrc"></div>
    <div class="a"><button class="btn ghost" id="sayCopy" type="button"></button><button class="btn ghost" id="sayClose" type="button"></button></div>
  </div>
  <form id="sayForm">
    <button class="ic" id="saySwap" type="button"></button>
    <input id="sayIn" type="text" maxlength="300" autocomplete="off" enterkeyhint="send">
    <button class="btn" id="sayGo" type="submit"></button>
  </form>
</section>
<footer>
  <button class="btn stop" id="stopBtn" type="button"></button>
  <button class="btn ghost" id="pauseBtn" type="button"></button>
  <button class="btn ghost" id="modeBtn" type="button"></button>
  <button class="btn ghost" id="ovlBtn" type="button"></button>
  <button class="btn ghost" id="shareBtn" type="button"></button>
  <button class="btn ghost" id="sayBtn" type="button" hidden aria-expanded="false"></button>
  <a class="btn ghost" id="homeBtn" href="/simple" hidden></a>
  <label class="chk"><input type="checkbox" id="onlyMine"><span id="onlyMineL"></span></label>
  <span id="ver" class="ver" style="margin-left:auto"></span>
</footer>

<dialog id="stopDlg">
  <h3 style="margin:0 0 8px" id="stopTitle"></h3>
  <p class="note" id="stopText" style="margin:0 0 14px"></p>
  <div style="display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap">
    <button class="btn ghost" id="stopNo" type="button"></button><button class="btn stop" id="stopYes" type="button"></button>
  </div>
</dialog>

<dialog id="pwDlg">
  <form method="dialog" id="pwForm">
    <label><b id="pwLabel"></b><input type="password" id="pwInput" autocomplete="current-password"></label>
    <p class="err" id="pwErr" hidden></p>
    <div style="display:flex;justify-content:flex-end"><button class="btn" id="pwOk" type="submit"></button></div>
  </form>
</dialog>

<dialog id="shareDlg">
  <h3 style="margin:0 0 6px" id="shTitle"></h3>
  <p class="note warn" id="shOff" hidden></p>
  <div id="shBody">
    <p class="note" id="shScan"></p>
    <img class="qr" id="shQr" alt="QR">
    <div id="shUrls"></div>
    <p class="note" id="shPw"></p>
  </div>
  <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:10px">
    <button class="btn" id="shRs" type="button" hidden></button><button class="btn ghost" id="shCopy" type="button"></button><button class="btn" id="shClose" type="button"></button>
  </div>
</dialog>

<script>
function showVer(v){const e=document.getElementById('ver');if(!e||!v)return;
  const full=`PCG v${v.version}${v.commit?' ('+v.commit+')':''}${v.upstream?' · jt-live-whisper v'+v.upstream:''}`;
  e.textContent='v'+v.version+(v.version==='dev'&&v.commit?' ('+v.commit+')':'');e.title=full;
  e.onclick=()=>{try{navigator.clipboard.writeText(full)}catch(x){}}}

const LANGS=[['zh','繁體中文'],['en','English'],['id','Bahasa Indonesia'],['vi','Tiếng Việt'],['hi','हिन्दी']];
const I18N={
zh:{stop_title:'要結束這一場字幕嗎？',stop_text:'結束後字幕會停止，連進來看的人也會看到「字幕已結束」。',stop_no:'繼續開會',stop_yes:'結束字幕',pw_ok:'連線',pw_bad:'密碼不對，請再輸入一次',my_lang:"我要看",xl_on:"{l}由字幕機另外翻譯",xl_off:"這場字幕沒有{l}",share:'分享',share_title:'讓其他人用手機看字幕',share_scan:"用手機相機掃描，或在瀏覽器輸入下面的網址（要連同一個公司網路）。打開後在右上角選自己的語言：中文、印尼文、越南文、印地語、英文都可以。",share_copy:'複製網址',copied:'已複製',close:'關閉',share_pw:'打開時要輸入同仁密碼。',share_nopw:'注意：沒有設定同仁密碼，同一個網路上的人都看得到。請 IT 在設定頁設定。',share_off:'IT 還沒有開啟「允許其他電腦或手機連進來看字幕」。請 IT 到「IT 設定」開啟。',share_restart:'IT 已開啟分享，但程式要重新啟動一次才會生效。按下面的按鈕：字幕會先停止，約 10 秒後回到首頁，再按一次「開始」。',share_rs_btn:'停止字幕並重新啟動程式',share_rs_wait:'正在重新啟動，請稍候…',share_rs_done:'已重新啟動，回到首頁後再按一次「開始」。',share_rs_fail:'沒有自動重新啟動成功，請重新開機，或點桌面的「PCG 會議翻譯」。',share_rs_manual:'請重新開機，再點桌面的「PCG 會議翻譯」。',share_noip:'找不到這台電腦的網路位址，請確認有連上公司網路。',running:'字幕進行中',waiting:'等待字幕…',paused:'已暫停',ended:'字幕已結束',empty:'開始說話後，字幕會出現在這裡',stop:'停止',pause:'暫停',resume:'繼續',
  say_btn:'打字回覆',say_ph:'用{a}打字，翻成{b}',say_go:'翻譯',say_copy:'複製',say_copied:'已複製',say_close:'關閉',say_show:'念出來，或給對方看（{b}）',say_fail:'沒有翻成功，請再試一次',say_wait:'翻譯中…',say_swap:'對調語言',say_off:'字幕進行中才能用',

function modeLangs(m){
  if(!m)return [];let x;
  if((x=m.match(/^([a-z]+)[_2]([a-z]+)$/)))return [x[1]==='nan'?'zh':x[1],x[2]];
  return [m==='nan'?'zh':m];
}
function modeName(m){
  if(!m)return '';
  let x;
  if((x=m.match(/^([a-z]+)_([a-z]+)$/)))return `${t('n_'+x[1])} ↔ ${t('n_'+x[2])}`;   // 雙向、教室模式（含外語對外語，例 vi_id）

  if(I18N.zh['n_'+m])return t('tr',{a:t('n_'+m)});
  return m;
}

  const a={lang:LABEL[ev.src_lang]||'',text:ev.src_text||'',tag:ev.src_lang||''};
  const b=ev.dst_text?{lang:LABEL[ev.dst_lang]||'',text:ev.dst_text,tag:ev.dst_lang||''}:null;
  const x=ev.extra&&ev.extra[lang];                 // 多語字幕：字幕機另外翻成我的語言
  if(a.lang!==lang&&(!b||b.lang!==lang)&&x)return [x,a];
  if(!b)return [a,null];
  if(a.lang===lang)return [a,b];
  if(b.lang===lang)return [b,a];
  return [b,a];
}
let drawn=[];          // 目前畫在畫面上的每一句（比對用）
function render(){
  const box=$('msgs');
  // 黑底的字幕模式只放聽到的話（最新兩句）；自己打的句子看下面的卡片（r32）
  const list=sub?events.filter(e=>e.source!=='typed'):events;
  if(!list.length){drawn=[];box.innerHTML=`<div class="empty">${state.running&&!state.ended&&!state.paused?ULI.listen:''}${esc(t('empty'))}</div>`;return}
  const htmls=list.map(ev=>{
    const [p,s]=pick(ev),me=ev.source==='mic'||ev.source==='typed';
    const sec=s&&!onlyMine?`<div class="s"><span class="tag">${esc(s.tag)}</span>${esc(s.text)}</div>`:'';
    return `<div class="m${me?' me':''}${ev.source==='typed'?' typed':''}"><div class="t">${esc(ev.timestamp||'')}</div><div class="p"><span class="tag">${esc(p.tag)}</span>${esc(p.text==='（翻譯失敗）'?t('fail'):p.text)}</div>${sec}</div>`;
  });
  // r30：只換有變的那一句、把新的接在後面（原本每次整段重畫，螢幕閱讀器會重念、選取的文字會消失）
  if(!drawn.length||htmls.length<drawn.length||box.children.length!==drawn.length)box.innerHTML=htmls.join('');
  else{
    const tmp=document.createElement('div');
    for(let i=0;i<drawn.length;i++)if(drawn[i]!==htmls[i]){tmp.innerHTML=htmls[i];box.replaceChild(tmp.firstElementChild,box.children[i])}
    if(htmls.length>drawn.length)box.insertAdjacentHTML('beforeend',htmls.slice(drawn.length).join(''));
  }
  drawn=htmls;
  const m=$('main');if(stick)m.scrollTop=m.scrollHeight;
}
/* 半句換整句（與 WebUI 同一條規則）：同一路 30 秒內、比較長、開頭大致相同 → 取代上一句 */
const norm=s=>String(s||'').toLowerCase().replace(/[^0-9a-zऀ-ॿÀ-ỹ぀-ヿ㐀-鿿가-힯]/g,'');
function finishes(o,n){o=norm(o);n=norm(n);if(o.length<2||n.length<=o.length)return false;let k=0;while(k<o.length&&o[k]===n[k])k++;
  const tail=/[぀-ヿ㐀-鿿가-힯]/.test(o)?2:4;return k>=2&&k*2>=o.length&&(k*10>=o.length*7||k>=o.length-tail)}
let stick=true;$('main').addEventListener('scroll',()=>{const m=$('main');stick=m.scrollHeight-m.scrollTop-m.clientHeight<80});
let lastEv=0;
setInterval(()=>{if(state.running&&!state.ended)paint()},1500);
function add(ev){
  if(!ev.src_text&&!ev.dst_text)return;
  ev._t=lastEv=Date.now();
  for(let i=events.length-1;i>=0&&i>=events.length-6&&ev.source!=='typed';i--){      // 打字的每一句都留著，不當成「半句換整句」
    const p=events[i];
    if(p.source===ev.source&&ev._t-p._t<30000&&finishes(p.src_text,ev.src_text)){events[i]=ev;render();return}
    if(p.source===ev.source)break;
  }
  events.push(ev);if(events.length>400)events.splice(0,events.length-400);
  state.running=true;state.ended=false;paint();render();
}
function paint(){
  document.documentElement.lang=lang==='zh'?'zh-Hant':lang;
  // 狀態：重新連線＝會動的連線圖示（警告色）；進行中＝麥克風圖示，幾秒沒有新字幕才會動（正在聽），字幕在跑時靜止
  const live=state.running&&!state.ended&&!state.paused,ic=$('sti');
  $('dot').classList.toggle('on',live);
  const kind=state.recon&&!state.ended?'connecting':live?'listen':'';
  if(ic.dataset.k!==kind){ic.dataset.k=kind;ic.innerHTML=kind?ULI[kind]:''}
  ic.hidden=!kind;$('dot').hidden=!!kind;ic.classList.toggle('warn',kind==='connecting');
  ic.classList.toggle('still',kind==='listen'&&Date.now()-lastEv<4000);
  $('st').textContent=t(state.ended?'ended':state.recon?'reconnect':state.paused?'paused':state.running?'running':'waiting');
  $('mode').textContent=modeName(state.mode);
  // 多語字幕（r19）：我選的語言不是這場的兩種語言時，說明字幕機會另外翻（或 IT 關掉了就說這場沒有）
  const ml=modeLangs(state.mode),xl=$('xl');
  xl.hidden=!(ml.length&&XLANG[lang]&&!ml.includes(lang));
  if(!xl.hidden)xl.textContent=t(state.multi?'xl_on':'xl_off',{l:t('n_'+lang)});
  $('myLangL').textContent=t('my_lang');
  $('stopBtn').textContent=t('stop');$('pauseBtn').textContent=t(state.paused?'resume':'pause');
  $('modeBtn').textContent=t(sub?'to_chat':'to_sub');$('ovlBtn').textContent=t('overlay');$('onlyMineL').textContent=t('only_mine');
  $('endText').textContent=state.idleMin?t('tr_idle',{n:state.idleMin}):t('ended');$('backBtn').textContent=t('back');$('endBanner').hidden=!state.ended;
  // 逐字稿（r33）：字幕結束後，收音的這台電腦可以下載這一場的文字；伺服器模式可以直接整理成會議紀錄
  const tr=state.ended&&state.local?state.tr:null;
  $('trDl').hidden=!tr;$('trMin').hidden=!(tr&&tr.minutes);$('trNote').hidden=!tr;
  if(tr){$('trDl').textContent=t('tr_dl');$('trDl').href='/simple/live/transcript/'+tr.id+'.txt';$('trMin').textContent=t('tr_min');
    if(!$('trNote').dataset.k)$('trNote').textContent=t('tr_lines',{n:tr.lines})}
  // 遠端觀看（唯讀）不能停止、暫停、開懸浮字幕
  $('shareBtn').textContent=t('share');
  for(const id of ['stopBtn','pauseBtn','ovlBtn'])$(id).hidden=!state.local||state.ended;
  $('shareBtn').hidden=!state.local;
  // 進行中也能回首頁（r30；原本只有字幕結束後才有「回到首頁」）：字幕不會停，首頁上方會有「打開字幕畫面」
  $('homeBtn').textContent=t('back');$('homeBtn').hidden=!state.local||state.ended;
  sayPaint();
  document.body.classList.toggle('sub',sub);document.documentElement.style.setProperty('--fs',fs+'px');
  $('onlyMine').checked=onlyMine;
}
$('langSel').innerHTML=LANGS.map(([c,n])=>`<option value="${c}">${n}</option>`).join('');$('langSel').value=lang;
$('langSel').onchange=()=>{lang=$('langSel').value;store.set('pcg_lang',lang);wantLang();paint();render()};
const fsStep=d=>{let i=FS.findIndex(x=>x>=fs);if(i<0)i=FS.length-1;i=Math.max(0,Math.min(FS.length-1,(FS[i]===fs?i:(d>0?i-1:i))+d));fs=FS[i];store.set('pcg_live_fs',fs);paint()};
$('fsUp').onclick=()=>fsStep(1);
$('fsDn').onclick=()=>fsStep(-1);
$('modeBtn').onclick=()=>{sub=!sub;store.set('pcg_live_sub',sub?'1':'0');paint();render()};
$('onlyMine').onchange=()=>{onlyMine=$('onlyMine').checked;store.set('pcg_live_only',onlyMine?'1':'0');render()};
$('ovlBtn').onclick=async()=>{try{const r=await(await fetch('/api/reopen-overlay',{method:'POST'})).json();if(!r.ok)alert(t('ovl_fail'))}catch(e){alert(t('ovl_fail'))}};
// 停止前的確認：頁面內的視窗，按鈕直接寫要做的事（r30；原本是瀏覽器的確認視窗，按鈕只有「確定／取消」）
$('stopBtn').onclick=()=>{$('stopTitle').textContent=t('stop_title');$('stopText').textContent=t('stop_text');
  $('stopNo').textContent=t('stop_no');$('stopYes').textContent=t('stop_yes');$('stopDlg').showModal();$('stopNo').focus()};
$('stopNo').onclick=()=>$('stopDlg').close();
$('stopYes').onclick=()=>{$('stopDlg').close();send({action:'stop'})};
$('pauseBtn').onclick=()=>{state.paused=!state.paused;send({action:state.paused?'pause':'resume'});paint()};

/* r32：打字回覆——用自己的語言打字，翻成對方的語言大字顯示（念出來、給對方看，或複製貼到會議的聊天）。
   翻譯交給正在跑字幕的主程式（/api/simple/say）；只有收音的這台電腦、這一場有翻譯時才出現 */
let sayOpen=store.get('pcg_live_say'),saySwapped=false,sayBusy=false,sayText='';
const sayPair=()=>{const r=state.reply;return !r?null:saySwapped?[r.other,r.me]:[r.me,r.other]};
function sayPaint(){
  const can=state.local&&!!state.reply&&state.running&&!state.ended,pr=sayPair();
  const open=can&&(sayOpen===null?!sub:sayOpen==='1');          // 沒選過：對話模式預設打開，黑底的字幕模式預設收起來
  $('sayBtn').hidden=!can;$('sayBtn').textContent=t('say_btn');$('sayBtn').setAttribute('aria-expanded',open?'true':'false');
  $('sayBar').hidden=!open;if(!pr)return;
  const a=t('n_'+pr[0]),b=t('n_'+pr[1]);
  $('saySwap').textContent=a+' → '+b+' ⇄';$('saySwap').title=t('say_swap');$('saySwap').setAttribute('aria-label',t('say_swap')+'：'+a+' → '+b);
  $('sayIn').placeholder=t('say_ph',{a,b});$('sayGo').textContent=t(sayBusy?'say_wait':'say_go');$('sayGo').disabled=sayBusy;
  $('sayCopy').textContent=t('say_copy');$('sayClose').textContent=t('say_close');
}
$('sayBtn').onclick=()=>{const open=!$('sayBar').hidden;sayOpen=open?'0':'1';store.set('pcg_live_say',sayOpen);sayPaint();if(!open)$('sayIn').focus()};
$('saySwap').onclick=()=>{saySwapped=!saySwapped;sayPaint();$('sayIn').focus()};
$('sayClose').onclick=()=>{$('sayCard').hidden=true;$('sayIn').focus()};
$('sayCopy').onclick=async()=>{try{await navigator.clipboard.writeText(sayText);$('sayCopy').textContent=t('say_copied')}catch(e){prompt('',sayText)}};
$('sayForm').onsubmit=async e=>{
  e.preventDefault();const text=$('sayIn').value.trim(),pr=sayPair();if(!text||sayBusy||!pr)return;
  sayBusy=true;sayPaint();
  let j={};try{j=await(await fetch('/api/simple/say',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text,swap:saySwapped})})).json()}catch(x){}
  sayBusy=false;sayPaint();
  const card=$('sayCard'),out=$('sayOut');card.hidden=false;out.classList.toggle('err',!j.ok);$('sayCopy').hidden=!j.ok;
  if(!j.ok){$('sayHead').textContent='';out.textContent=t(j.code==='say_not_running'?'say_off':'say_fail');$('saySrc').textContent=text;return}
  sayText=j.text;$('sayHead').textContent=t('say_show',{b:t('n_'+j.tgt)});out.textContent=j.text;out.lang=j.tgt==='zh'?'zh-Hant':j.tgt;$('saySrc').textContent=text;
  $('sayIn').value='';$('sayIn').focus();
  // 也留在這一頁的對話裡（只有這台電腦看得到，不會送給用手機看字幕的人）
  add({source:'typed',src_lang:TAG[j.src]||j.src,src_text:text,dst_lang:TAG[j.tgt]||j.tgt,dst_text:j.text,timestamp:new Date().toTimeString().slice(0,8)});
};
/* r33：這一場的逐字稿（只有收音的這台電腦拿得到） */
async function loadTr(){
  if(!state.local)return;
  try{const j=await(await fetch('/api/simple/live/transcripts',{cache:'no-store'})).json();
    const s=(j.sessions||[])[0];state.tr=s?{id:s.id,lines:s.lines,minutes:!!j.minutes}:null;paint()}catch(e){}
}
$('trMin').onclick=async()=>{
  const b=$('trMin'),n=$('trNote');if(!state.tr)return;b.disabled=true;
  let cid=store.get('pcg_client');if(!cid){cid=Array.from(crypto.getRandomValues(new Uint8Array(12)),x=>x.toString(16).padStart(2,'0')).join('');store.set('pcg_client',cid)}
  let j={};try{j=await(await fetch('/api/simple/live/minutes',{method:'POST',headers:{'Content-Type':'application/json','X-Client-Id':cid,'X-Simple-Token':token},body:JSON.stringify({id:state.tr.id})})).json()}catch(e){}
  n.dataset.k='1';
  if(!j.ok){n.textContent=t('tr_min_fail',{e:j.error||j.code||''});b.disabled=false;return}
  n.textContent=t('tr_min_go');store.set('pcg_tab','pFile');setTimeout(()=>{location.href='/simple'},1200);
};
async function liveInfo(){
  try{const j=await(await fetch('/api/simple/live',{cache:'no-store'})).json();state.reply=j.reply||null;saySwapped=false;paint()}catch(e){}
}

/* 分享：QR Code＋網址（只在收音的這台電腦上） */
let shareUrl='';
$('shareBtn').onclick=async()=>{
  let j={};try{j=await(await fetch('/api/simple/share')).json()}catch(e){}
  $('shTitle').textContent=t('share_title');$('shCopy').textContent=t('share_copy');$('shClose').textContent=t('close');
  const off=!j.allowed?t('share_off'):!j.bound?t('share_restart'):!(j.urls||[]).length?t('share_noip'):'';
  const needRs=j.allowed&&!j.bound;
  $('shOff').hidden=!off;$('shOff').textContent=needRs&&!j.can_restart?t('share_restart')+' '+t('share_rs_manual'):off;
  $('shBody').hidden=!!off;$('shCopy').hidden=!!off;
  $('shRs').hidden=!(needRs&&j.can_restart);$('shRs').disabled=false;$('shRs').textContent=t('share_rs_btn');
  if(!off){
    shareUrl=j.urls[0];
    $('shScan').textContent=t('share_scan');
    $('shQr').src='/api/simple/share/qr.svg?u='+encodeURIComponent(shareUrl);
    $('shUrls').innerHTML=j.urls.map(u=>`<div class="url">${esc(u)}</div>`).join('');
    $('shPw').textContent=t(j.password_set?'share_pw':'share_nopw');$('shPw').classList.toggle('warn',!j.password_set);
  }
  $('shareDlg').showModal();
};
$('shClose').onclick=()=>$('shareDlg').close();
// 程式自己重新啟動（r20）：同仁不用去工作管理員關 python.exe。字幕會先停止，重開後回首頁再按一次開始
$('shRs').onclick=async()=>{
  const b=$('shRs');b.disabled=true;$('shOff').textContent=t('share_rs_wait');
  let j={};try{j=await(await fetch('/api/simple/restart',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({stop_live:true})})).json()}catch(e){}
  if(!j.ok){$('shOff').textContent=j.error||t('share_rs_fail');b.disabled=false;return}
  for(let i=0;i<60;i++){
    await new Promise(r=>setTimeout(r,1000));
    try{const s=await(await fetch('/api/simple/share',{cache:'no-store'})).json();
      if(s.ok&&s.bound){$('shOff').textContent=t('share_rs_done');setTimeout(()=>{location.href='/simple'},1500);return}}catch(e){}
  }
  $('shOff').textContent=t('share_rs_fail');
};
$('shCopy').onclick=async()=>{try{await navigator.clipboard.writeText(shareUrl);$('shCopy').textContent=t('copied')}catch(e){prompt('',shareUrl)}};

let ws=null,retry=null;
function send(o){if(ws&&ws.readyState===1)ws.send(JSON.stringify(o))}
// 多語字幕（r19）：告訴字幕機「我要看哪種語言」；這一句沒有這種語言時，字幕機會另外翻一份（transcription_extra）
function wantLang(){send({action:'want_lang',lang:XLANG[lang]?lang:''})}
function addExtra(ev){
  const e=events.find(x=>x.id===ev.id);if(!e||!ev.text)return;
  (e.extra=e.extra||{})[ev.lang_code]={lang:ev.lang_code,text:ev.text,tag:ev.lang};
  if(ev.lang_code===lang)render();
}
function askPw(){
  const d=$('pwDlg');$('pwLabel').textContent=t('pw');$('pwOk').textContent=t('pw_ok');
  $('pwErr').hidden=!token;$('pwErr').textContent=t('pw_bad');$('pwInput').value='';
  if(!d.open)d.showModal();$('pwInput').focus();
}
$('pwForm').onsubmit=()=>{const p=$('pwInput').value;if(!p)return false;token=p;store.set('pcg_token',p);setTimeout(conn,0)};
function conn(){
  const url=(location.protocol==='https:'?'wss:':'ws:')+'//'+location.host+'/ws'+(token?'?token='+encodeURIComponent(token):'');
  ws=new WebSocket(url);
  ws.onopen=()=>{if(retry){clearTimeout(retry);retry=null}state.recon=false;paint();wantLang()};
  ws.onmessage=e=>{let ev;try{ev=JSON.parse(e.data)}catch(x){return}
    if(ev.type==='transcription')add(ev);
    else if(ev.type==='transcription_extra')addExtra(ev);
    else if(ev.type==='started'){state.running=true;state.ended=false;state.idleMin=0;state.tr=null;state.mode=ev.mode||state.mode;paint();liveInfo()}
    else if(ev.type==='stopped'||ev.type==='disconnected'){state.ended=true;state.running=false;
      if(ev.reason==='idle')state.idleMin=ev.minutes||0;          // 太久沒有字幕自動結束（r33）
      paint();loadTr()}};
  ws.onclose=e=>{
    if(e.code===4001)return askPw();          // 密碼：頁面內的視窗（r29；原本是瀏覽器的 prompt，密碼明文、投影時全場看得到）
    if(!state.ended){state.recon=true;paint()}
    retry=setTimeout(conn,3000);
  };
}
(async()=>{
  try{const j=await(await fetch('/api/simple/live')).json();showVer(j.version);state.local=!!j.local;state.running=!!j.running;state.mode=j.mode||'';state.multi=j.multi_lang!==false;state.reply=j.reply||null;
    // 會議室字幕機（r19）：從同仁頁面開始時直接顯示 QR Code
    if(/[?&]share=1/.test(location.search)){sub=true;store.set('pcg_live_sub','1');if(fs<36){fs=36;store.set('pcg_live_fs',fs)}   // 會議室字幕機：直接用大字的字幕模式（r29）
      history.replaceState(null,'',location.pathname);setTimeout(()=>$('shareBtn').click(),300)}state.ended=!j.running&&false}catch(e){}
  paint();render();conn();
})();
</script>
